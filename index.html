<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TagShop – Luxury Watch Concierge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Montserrat', sans-serif; margin: 20px; background: #f7f7f7; }
  h1, h2 { font-family: 'Playfair Display', serif; }
  #searchContainer { margin-bottom: 20px; }
  #searchResults div, #productWall div { background: #fff; padding: 10px; margin: 10px 0; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
  button { margin-left: 10px; padding: 5px 10px; cursor: pointer; }
  #checkoutFormContainer { background: #fff; padding: 20px; border-radius: 8px; display:none; max-width: 400px; margin-top: 20px; }
  input, textarea { width: 100%; padding: 5px; margin-bottom: 10px; }
  .pagination { margin-top: 10px; }
</style>
</head>
<body>

<h1>TagShop – Luxury Watch Concierge</h1>

<!-- Admin login -->
<button id="adminLoginBtn">Admin Login</button>

<!-- Admin search -->
<div id="searchContainer" style="display:none;">
  <h2>Admin Search</h2>
  <input type="text" id="searchInput" placeholder="Search watches">
  <div id="searchResults"></div>
  <div class="pagination">
    <button id="prevBtn">Previous</button>
    <button id="nextBtn">Next</button>
  </div>
</div>

<!-- Product wall visible to public -->
<h2>Product Wall</h2>
<div id="productWall"></div>

<!-- Checkout/contact form -->
<div id="checkoutFormContainer"></div>

<script>
// -------------------- Product Data --------------------
const products = [
  { id: 1, name: "Rolex Submariner", brand: "Rolex", features: ["Box", "Automatic"], price: 12000, supplierLink:"#"},
  { id: 2, name: "Omega Seamaster", brand: "Omega", features: ["Box", "Chronometer"], price: 9000, supplierLink:"#"},
  { id: 3, name: "Tag Heuer Carrera", brand: "Tag Heuer", features: ["Box"], price: 7500, supplierLink:"#"},
  { id: 4, name: "Patek Philippe Nautilus", brand: "Patek Philippe", features: ["Box"], price: 30000, supplierLink:"#"}
  // Add more products here
];

// -------------------- Admin Login --------------------
let isAdmin = false;
const adminPassword = "YOUR_SECRET_PASSWORD"; // change to your password

document.getElementById("adminLoginBtn").addEventListener("click", () => {
  const password = prompt("Enter admin password:");
  if(password === adminPassword){
    isAdmin = true;
    document.getElementById("searchContainer").style.display = "block";
    alert("Admin mode enabled");
  } else {
    alert("Wrong password");
  }
});

// -------------------- Search --------------------
const searchInput = document.getElementById("searchInput");
const searchResultsContainer = document.getElementById("searchResults");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

let currentResults = [];
let currentPage = 0;
const resultsPerPage = 2; // adjust number of results per page

searchInput.addEventListener("input", () => {
  const query = searchInput.value.toLowerCase();
  currentResults = products.filter(p => 
    p.name.toLowerCase().includes(query) ||
    p.brand.toLowerCase().includes(query) ||
    p.features.some(f => f.toLowerCase().includes(query))
  );
  currentPage = 0;
  renderSearchResults();
});

function renderSearchResults(){
  searchResultsContainer.innerHTML = "";
  if(currentResults.length === 0){
    searchResultsContainer.innerHTML = "<p>No results</p>";
    return;
  }
  const start = currentPage * resultsPerPage;
  const end = start + resultsPerPage;
  const pageResults = currentResults.slice(start, end);

  pageResults.forEach(p => {
    const div = document.createElement("div");
    div.innerHTML = `${p.name} - ${p.brand} - $${p.price} 
      <button class="addBtn">Add to Wall</button>`;
    div.querySelector(".addBtn").addEventListener("click", () => addToWall(p));
    searchResultsContainer.appendChild(div);
  });
}

prevBtn.addEventListener("click", () => {
  if(currentPage > 0){ currentPage--; renderSearchResults(); }
});

nextBtn.addEventListener("click", () => {
  if((currentPage + 1) * resultsPerPage < currentResults.length){
    currentPage++; renderSearchResults();
  }
});

// -------------------- Product Wall --------------------
let productWall = [];

function addToWall(product){
  if(!productWall.find(p => p.id === product.id)){
    productWall.push(product);
    renderWall();
  }
}

function renderWall(){
  const wall = document.getElementById("productWall");
  wall.innerHTML = "";
  productWall.forEach(p => {
    const div = document.createElement("div");
    div.innerHTML = `${p.name} - $${p.price} 
      <button class="supplierBtn">Buy with Supplier</button> 
      <button class="tagshopBtn">Buy with TagShop</button>`;
    
    // Buy with Supplier
    div.querySelector(".supplierBtn").addEventListener("click", () => {
      window.open(p.supplierLink, "_blank");
    });

    // Buy with TagShop
    div.querySelector(".tagshopBtn").addEventListener("click", () => openCheckout(p));

    wall.appendChild(div);
  });
}

// -------------------- Checkout / Contact Form --------------------
const checkoutContainer = document.getElementById("checkoutFormContainer");

function openCheckout(product){
  checkoutContainer.style.display = "block";
  checkoutContainer.innerHTML = `
    <h3>Buying with TagShop</h3>
    <p>Product: ${product.name}</p>
    <p>Brand: ${product.brand}</p>
    <p>Price: $${product.price}</p>
    <form id="contactForm">
      <label>Name:</label><br><input type="text" name="name" required><br>
      <label>Email:</label><br><input type="email" name="email" required><br>
      <label>Message / Notes:</label><br>
      <textarea name="message" placeholder="Optional"></textarea><br>
      <button type="submit">Confirm & Pay</button>
    </form>
  `;

  document.getElementById("contactForm").addEventListener("submit", (e)=>{
    e.preventDefault();
    // Here you can also send form data via EmailJS or Formspree if desired

    // Redirect to Wise
    window.location.href = "https://wise.com/pay/your-payment-link";
  });
}

</script>
</body>
</html>
