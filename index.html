<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TagShop • Exclusive Private Watch Concierge</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --text: #e8d9b0;
      --gold: #d4af37;
      --gold-dark: #b8962e;
      --card-bg: rgba(30,30,30,0.45);
      --card-hover: rgba(50,50,50,0.65);
      --accent: #c9a96e;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      overflow-y: auto;
    }

    h1, h2, h3 {
      font-family: 'Playfair Display', serif;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .hero-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
    }
    .hero-bg img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.8s ease-in-out;
      animation: cinematicFade 60s infinite;
    }
    .hero-bg img:nth-child(1) { animation-delay: 0s; }
    .hero-bg img:nth-child(2) { animation-delay: 12s; }
    .hero-bg img:nth-child(3) { animation-delay: 24s; }
    .hero-bg img:nth-child(4) { animation-delay: 36s; }
    .hero-bg img:nth-child(5) { animation-delay: 48s; }

    @keyframes cinematicFade {
      0%   { opacity: 0; }
      5%   { opacity: 1; }
      20%  { opacity: 1; }
      25%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 20%, rgba(212,175,55,0.12), transparent 60%),
                  linear-gradient(to bottom, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.95) 70%);
      z-index: -1;
    }

    header {
      text-align: center;
      padding: 140px 20px 80px;
      animation: fadeUp 1.8s ease-out;
    }
    header h1 {
      font-size: 4.2rem;
      margin-bottom: 0.25em;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
    header p {
      font-size: 1.3rem;
      opacity: 0.9;
      max-width: 780px;
      margin: 0 auto;
      letter-spacing: 0.5px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .container {
      max-width: 1480px;
      margin: 0 auto;
      padding: 0 40px 120px;
      position: relative;
      z-index: 2;
    }

    .admin-only { display: none; }

    .search-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      justify-content: center;
      margin: 60px 0 80px;
      animation: fadeUp 1.6s ease-out 0.4s both;
    }
    input[type="text"], button {
      padding: 18px 28px;
      font-size: 1.15rem;
      border: none;
      border-radius: 16px;
      transition: all 0.35s;
    }
    input[type="text"] {
      flex: 1;
      min-width: 380px;
      background: rgba(255,255,255,0.08);
      color: white;
      backdrop-filter: blur(8px);
    }
    button {
      background: var(--gold);
      color: #000;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--gold-dark); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(212,175,55,0.25); }

    .section-title {
      text-align: center;
      font-size: 2.8rem;
      margin: 100px 0 60px;
      position: relative;
    }
    .section-title::after {
      content: "";
      width: 120px;
      height: 2px;
      background: var(--accent);
      opacity: 0.6;
      display: block;
      margin: 20px auto 0;
    }

    .carousel {
      overflow: hidden;
      position: relative;
    }
    .carousel-track {
      display: flex;
      gap: 40px;
      padding: 30px 0;
      transition: transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .card {
      flex: 0 0 340px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 24px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(212,175,55,0.15);
      transition: all 0.5s ease;
      opacity: 0;
      transform: translateY(40px);
      animation: cardReveal 1s forwards;
    }
    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.2s; }
    .card:nth-child(3) { animation-delay: 0.3s; }
    .card:hover {
      transform: translateY(-18px) scale(1.03);
      background: var(--card-hover);
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    }
    .card img {
      width: 100%;
      height: 280px;
      object-fit: contain;
      background: #111;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      transition: transform 0.4s;
    }
    .card:hover img { transform: scale(1.06); }

    .card h4 {
      font-size: 1.35rem;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .card .desc {
      font-size: 0.97rem;
      opacity: 0.82;
      margin-bottom: 16px;
      line-height: 1.55;
    }
    .card .highlight {
      color: #ffeb3b;
      font-weight: 600;
      font-size: 1rem;
      margin: 10px 0;
    }
    .card .price {
      color: var(--gold);
      font-weight: 700;
      font-size: 1.25rem;
    }

    .price-input {
      width: 100%;
      margin: 14px 0 10px;
      padding: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(212,175,55,0.3);
      color: white;
      border-radius: 12px;
      font-size: 1.05rem;
    }

    .btn-row {
      display: flex;
      gap: 14px;
      margin-top: 16px;
    }
    .btn-row button {
      flex: 1;
      padding: 14px;
      font-size: 0.98rem;
    }
    .btn-curate   { background: rgba(212,175,55,0.25); color: var(--gold); }
    .btn-publish  { background: #00e68a; color: #000; font-weight: 600; }

    @keyframes cardReveal {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 980px) {
      .card { flex: 0 0 300px; }
      header h1 { font-size: 3.4rem; }
    }
  </style>
</head>
<body>

<div class="hero-bg">
  <img src="https://www.shutterstock.com/image-photo/beautifully-designed-wrist-watch-dark-260nw-1761441800.jpg" alt="Cinematic luxury watch">
  <img src="https://www.shutterstock.com/image-photo/closeup-luxury-man-wrist-watch-260nw-726157354.jpg" alt="Timeless elegance">
  <img src="https://www.shutterstock.com/image-photo/nice-luxury-mans-wrist-watch-260nw-2114443649.jpg" alt="Gold accents drama">
  <img src="https://www.shutterstock.com/image-photo/black-luxury-watch-on-coals-260nw-1914091201.jpg" alt="Dark moody masterpiece">
  <img src="https://png.pngtree.com/thumb_back/fw800/background/20251117/pngtree-luxury-wristwatch-featuring-gold-accents-and-an-intricate-design-creating-elegant-image_20331816.webp" alt="Sophisticated timepiece">
</div>
<div class="overlay"></div>

<header>
  <h1>TagShop</h1>
  <p>Exclusive Private Concierge • Curated Collector Masterpieces • Where Time Becomes Legacy</p>
</header>

<div class="container">

  <!-- Admin Controls -->
  <div class="search-bar admin-only">
    <input id="q" placeholder="Search Rolex, Audemars Piguet, Patek Philippe…" autocomplete="off"/>
    <button onclick="search()">Explore Network</button>
  </div>

  <div class="admin-only" style="text-align:center; margin:40px 0;">
    <button onclick="logoutAdmin()" style="background:#c0392b; color:white; padding:14px 40px;">Exit Admin Mode</button>
  </div>

  <!-- Public Showcase -->
  <h2 class="section-title">Curated Masterpieces</h2>
  <div class="carousel">
    <div class="carousel-track" id="shopTrack"></div>
  </div>

  <!-- Admin Sections -->
  <h2 class="section-title admin-only">Search Results</h2>
  <div class="carousel admin-only">
    <div class="carousel-track" id="searchTrack"></div>
  </div>

  <h2 class="section-title admin-only">Private Curation Vault</h2>
  <div class="carousel admin-only">
    <div class="carousel-track" id="showcaseTrack"></div>
  </div>

</div>

<script>
const ADMIN_PASS = "lux2026elite"; // ← CHANGE THIS to your secure password
const ADMIN_KEY = "tagshop_elite_access";
const SHOP_KEY = "tagshop_live_collection";

let shop = JSON.parse(localStorage.getItem(SHOP_KEY) || "[]");
let showcase = []; // Admin only - reset on logout

function isAdmin() { return localStorage.getItem(ADMIN_KEY) === "true"; }

function showAdmin() {
  document.querySelectorAll(".admin-only").forEach(el => el.style.display = "block");
}

function hideAdmin() {
  document.querySelectorAll(".admin-only").forEach(el => el.style.display = "none");
}

function loginAdmin() {
  const pass = prompt("Private Concierge Access — Enter credentials:");
  if (pass === ADMIN_PASS) {
    localStorage.setItem(ADMIN_KEY, "true");
    showAdmin();
    alert("Welcome, Concierge. Access granted.");
  } else {
    alert("Access denied.");
  }
}

function logoutAdmin() {
  localStorage.removeItem(ADMIN_KEY);
  hideAdmin();
  alert("Concierge session ended.");
}

function renderShop() {
  const track = document.getElementById("shopTrack");
  track.innerHTML = shop.length === 0 
    ? '<p style="text-align:center; padding:120px 0; opacity:0.7; font-size:1.3rem;">The collection awaits its first masterpiece…</p>'
    : '';

  shop.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${item.img}" alt="${item.title}" loading="lazy">
      <h4>${item.title}</h4>
      <p class="desc">${item.desc || "A timeless icon of precision and elegance."}</p>
      <p class="price">£${(item.tagshopPrice || 0).toLocaleString()}</p>
      <div class="btn-row">
        <button onclick="window.open('${item.link}','_blank')">View Details</button>
        <button style="background:#00e68a;">Enquire Privately</button>
      </div>
    `;
    track.appendChild(card);
  });
}

// Simple admin add function (expand later with full search)
function addToShop(title, img, price, link, desc = "") {
  shop.unshift({ title, img, tagshopPrice: price, link, desc });
  localStorage.setItem(SHOP_KEY, JSON.stringify(shop));
  renderShop();
}

// Example initial masterpieces (replace with your real data)
if (shop.length === 0) {
  addToShop(
    "Rolex Submariner Date",
    "https://cdn.shopify.com/s/files/1/0059/5152/0820/files/image21_jpg_600x600.webp?v=1693417439",
    14500,
    "https://www.rolex.com",
    "The definitive dive watch — iconic, robust, eternally desired."
  );
  addToShop(
    "Audemars Piguet Royal Oak",
    "http://timepiecetradingllc.com/cdn/shop/articles/Limited_Edition_Alert_Audemars_Piguet_Royal_Oak_Sand_Gold.jpg?v=1717021497",
    52000,
    "https://www.audemarspiguet.com",
    "Architectural brilliance meets haute horlogerie."
  );
  addToShop(
    "Patek Philippe Nautilus",
    "https://swisswatches-magazine.com/uploads/2021/11/Patek-Philippe-PP-Nautilus-5711A-Gerald-Genta-Design-2048x1365.jpg",
    98000,
    "https://www.patek.com",
    "The pinnacle of understated luxury — forever iconic."
  );
}

// Init
renderShop();

if (!isAdmin()) {
  hideAdmin();
  setTimeout(() => {
    if (confirm("Would you like to enter Private Concierge Mode?")) {
      loginAdmin();
    }
  }, 1800);
} else {
  showAdmin();
}
</script>
</body>
</html>
