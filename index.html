<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TagShop – Luxury Watch Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#f5d77c;
  --glass:rgba(35,35,35,.55);
  --diamond:linear-gradient(145deg,#fff,#f5d77c,#caa54d);
}

body{
  margin:0;
  font-family:Montserrat;
  background:#050505;
  color:#fff;
}

/* Background slideshow */
.hero-bg{position:fixed;inset:0;z-index:-2;overflow:hidden;}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3),rgba(0,0,0,.85));z-index:2;}
.hero-slides img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0;animation:fade 30s infinite;}
.hero-slides img:nth-child(1){animation-delay:0s;}
.hero-slides img:nth-child(2){animation-delay:6s;}
.hero-slides img:nth-child(3){animation-delay:12s;}
.hero-slides img:nth-child(4){animation-delay:18s;}
.hero-slides img:nth-child(5){animation-delay:24s;}
@keyframes fade{0%{opacity:0}5%{opacity:1}20%{opacity:1}25%{opacity:0}100%{opacity:0}}

.section{max-width:1200px;margin:auto;padding:30px 20px;}
.glass{background:var(--glass);backdrop-filter:blur(16px);border-radius:20px;padding:25px;border:1px solid rgba(255,215,0,.3);}

#results{display:flex;gap:20px;overflow-x:auto;padding-bottom:20px;}
#results::-webkit-scrollbar{height:8px}
#results::-webkit-scrollbar-thumb{background:var(--gold);border-radius:10px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:25px;}

.card{min-width:220px;background:rgba(255,255,255,.08);border-radius:18px;padding:15px;border:1px solid rgba(255,215,0,.25);}
.card img{width:100%;height:200px;object-fit:contain;background:#fff;padding:10px;border-radius:12px;}
.card h4{color:var(--gold);font-size:1rem}

button{width:100%;background:var(--diamond);border:none;padding:12px;border-radius:30px;font-weight:700;cursor:pointer;margin-top:6px;}
.buy-dh{background:#111;color:#fff}

#cartBar{
  position:fixed;
  bottom:20px;
  right:20px;
  background:var(--glass);
  backdrop-filter:blur(15px);
  padding:15px 25px;
  border-radius:30px;
  border:1px solid rgba(255,215,0,.4);
  display:none;
  z-index:10;
}
</style>
</head>

<body>

<div class="hero-bg">
  <div class="hero-slides">
    <img src="https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3?auto=format&fit=crop&w=1600&q=80">
    <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1600&q=80">
    <img src="https://images.unsplash.com/photo-1601924638867-3ec62b5d35a1?auto=format&fit=crop&w=1600&q=80">
    <img src="https://images.unsplash.com/photo-1599940824399-b87987ceb72a?auto=format&fit=crop&w=1600&q=80">
    <img src="https://images.unsplash.com/photo-1612817159949-195b6eb9e31a?auto=format&fit=crop&w=1600&q=80">
  </div>
</div>

<div class="section">
  <h2>Luxury Collection</h2>
  <div id="results"></div>
</div>

<div class="section glass">
<input id="q" placeholder="Search Rolex, Omega, AP, Patek…">
<button onclick="search()">Search</button>
</div>

<div class="section glass">
<h2>Why Buy With TagShop?</h2>
<p>Some sellers don’t communicate or misrepresent products. TagShop sources the best version with original markings, correct weight and insured UK delivery.</p>
</div>

<div class="section">
<h2>Your Reserved Watches</h2>
<div id="showcase" class="grid"></div>
</div>

<div class="section glass" id="checkout" style="display:none">
<input placeholder="Full Name">
<input placeholder="Email">
<textarea placeholder="Delivery Address"></textarea>
<button onclick="pay()">Secure Wise Checkout</button>
<p id="thanks" style="display:none;color:var(--gold)">Order confirmed – email sent.</p>
</div>

<div id="cartBar">
<span id="cartCount">0</span> Watches Reserved • <span id="cartTotal">£0</span>
</div>

<script>
const API="AIzaSyB9YwW8EVXQJsVwSMbJrk-NU9B9ZrzzkGs";
const CX="f7e219616fe1d4629";
const AFF="2545671";
const WISE="https://wise.com/pay/me/davids14542";
const PRICE=249;

let last=[],showcase=[];

async function search(){
 const q=document.getElementById("q").value;
 const r=await fetch(`https://www.googleapis.com/customsearch/v1?q=${encodeURIComponent(q)}&cx=${CX}&key=${API}`);
 const d=await r.json();
 last=d.items.filter(i=>i.link.includes("dhgate")).map(i=>({
  title:i.title,
  img:i.pagemap?.cse_image?.[0]?.src || "https://i.imgur.com/JbGQH6g.png",
  link:i.link.includes("?")?i.link+"&aff="+AFF:i.link+"?aff="+AFF
 }));
 render(last,"results");
}

function render(arr,id){
 const box=document.getElementById(id);
 box.innerHTML="";
 arr.forEach((p,i)=>{
  const d=document.createElement("div");
  d.className="card";
  d.innerHTML=`
    <img src="${p.img}">
    <h4>${p.title}</h4>
    <button class="buy-dh" onclick="window.open('${p.link}','_blank')">Buy Direct</button>
    <button class="buy-ts" data-index="${i}">Buy with TagShop</button>
  `;
  box.appendChild(d);
 });
 document.querySelectorAll(".buy-ts").forEach(btn=>{
  btn.onclick=()=>add(btn.getAttribute("data-index"));
 });
}

function add(i){
 const item=last[i];
 if(!item) return;
 if(showcase.find(p=>p.link===item.link)) return alert("Already reserved.");
 showcase.push(item);
 render(showcase,"showcase");
 updateCart();
 document.getElementById("checkout").style.display="block";
}

function updateCart(){
 document.getElementById("cartBar").style.display="block";
 document.getElementById("cartCount").innerText=showcase.length;
 document.getElementById("cartTotal").innerText="£"+(showcase.length*PRICE);
}

function pay(){
 document.getElementById("thanks").style.display="block";
 window.open(WISE);
}
</script>

</body>
</html>
