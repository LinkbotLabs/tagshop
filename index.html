<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TagShop – Luxury Watch Concierge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
 --gold:#f5d77c;
 --glass:rgba(25,25,25,.6);
 --diamond:linear-gradient(145deg,#fff,#f5d77c,#caa54d);
}

body{margin:0;font-family:Montserrat;background:#050505;color:#fff}
h1,h2{font-family:Playfair Display;color:var(--gold)}

.hero{
 position:fixed; inset:0; z-index:-2;
 background:url("https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3") center/cover no-repeat;
}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3),#000)}

.section{max-width:1300px;margin:auto;padding:25px}

.glass{
 background:var(--glass);
 backdrop-filter:blur(16px);
 border-radius:25px;
 padding:25px;
 border:1px solid rgba(255,215,0,.3)
}

input{width:100%;padding:14px;border-radius:30px;border:none;margin-bottom:10px}

#results,#top10{
 display:flex;
 gap:18px;
 overflow-x:auto;
 scroll-snap-type:x mandatory;
 padding:15px 0;
}

.card{
 background:rgba(255,255,255,.07);
 border-radius:18px;
 padding:12px;
 min-width:165px;
 max-width:165px;
 scroll-snap-align:start;
 border:1px solid rgba(255,215,0,.25);
 transition:.35s;
}

.card:hover{
 transform:scale(1.08);
 box-shadow:0 0 25px rgba(245,215,124,.7);
}

.card img{
 width:100%;
 height:130px;
 object-fit:contain;
 background:#fff;
 border-radius:12px;
}

.badge{
 background:var(--gold);
 color:#000;
 font-size:.7rem;
 padding:4px 8px;
 border-radius:20px;
 display:inline-block;
 margin-top:5px;
}

.price{color:var(--gold);font-weight:700;margin-top:4px}

button{
 width:100%;
 border:none;
 padding:10px;
 border-radius:30px;
 font-weight:700;
 margin-top:6px;
 background:var(--diamond);
 cursor:pointer
}

.buy{background:#111;color:#fff}

.stars{color:gold;font-size:.8rem}

#showcase{display:flex;gap:15px;flex-wrap:wrap}
</style>
</head>

<body>

<div class="hero"></div>

<div class="section glass">
<h1>TagShop Luxury Watch Concierge</h1>
<p>Curated UK-grade dealer network. Verified AAA pieces. Insured Wise checkout.</p>
<input id="q" placeholder="Search Rolex, Omega, TAG Heuer, AP…">
<button onclick="search()">Search Dealer Network</button>
</div>

<div class="section">
<h2>🏆 TagShop Top 10 Picks</h2>
<div id="top10"></div>
</div>

<div class="section">
<h2>Dealer Results</h2>
<div id="results"></div>
</div>

<div class="section glass">
<h2>Your Reserved Watches</h2>
<div id="showcase"></div>
<button onclick="checkout()">Pay with Wise</button>
<p id="thanks" style="display:none;color:var(--gold)">Payment link opened — your order is reserved.</p>
</div>

<script>
const API="AIzaSyB9YwW8EVXQJsVwSMbJrk-NU9B9ZrzzkGs";
const CX="f7e219616fe1d4629";
const AFF="2545671";
const WISE="https://wise.com/pay/me/davids14542";

let start=1,last=[],showcase=[];
let top10=JSON.parse(localStorage.getItem("top10")||"[]");

function score(t){
 t=t.toLowerCase(); let s=0;
 if(t.includes("aaa"))s+=3;
 if(t.includes("box"))s+=2;
 if(t.includes("904l"))s+=3;
 if(t.includes("sapphire"))s+=2;
 return s;
}

function search(){start=1;fetchResults()}
async function fetchResults(){
 const r=await fetch(`https://www.googleapis.com/customsearch/v1?q=${encodeURIComponent(q.value)}&cx=${CX}&key=${API}&start=${start}`);
 const d=await r.json();

 last=d.items.filter(i=>i.link.includes("dhgate")).map(i=>({
  title:i.title,
  img:i.pagemap?.cse_image?.[0]?.src||"https://i.imgur.com/JbGQH6g.png",
  link:i.link.includes("?")?i.link+"&aff="+AFF:i.link+"?aff="+AFF,
  score:score(i.title),
  price:Math.round(Math.random()*120+150)
 })).sort((a,b)=>b.score-a.score);

 renderResults();
}

function renderResults(){
 results.innerHTML="";
 last.forEach((p,i)=>{
 results.innerHTML+=`
 <div class="card">
  <img src="${p.img}">
  <div class="stars">★★★★★</div>
  <div class="badge">Dealer Score ${p.score}</div>
  <div class="price">£${p.price}</div>
  <button class="buy" onclick="window.open('${p.link}','_blank')">Buy Direct</button>
  <button onclick="addTop10(${i})">Add to Top 10</button>
 </div>`;
 });
}

function addTop10(i){
 if(top10.length>=10)return alert("Top 10 full");
 const p=last[i];
 if(top10.find(x=>x.link===p.link))return;
 top10.push(p);
 localStorage.setItem("top10",JSON.stringify(top10));
 renderTop10();
}

function addToShowcase(p){
 if(showcase.find(x=>x.link===p.link))return;
 showcase.push(p);
 renderShowcase();
}

function renderShowcase(){
 const c=document.getElementById("showcase");
 c.innerHTML="";
 showcase.forEach(p=>{
  c.innerHTML+=`
  <div class="card">
   <img src="${p.img}">
   <div class="price">£299</div>
  </div>`;
 });
}

function renderTop10(){
 const t=document.getElementById("top10");
 t.innerHTML="";
 top10.forEach((p,i)=>{
 t.innerHTML+=`
 <div class="card">
  <img src="${p.img}">
  <div class="badge">TagShop Verified</div>
  <div class="stars">★★★★★ UK Supplier</div>
  <div class="price">£299</div>
  <button class="buy" onclick="window.open('${p.link}','_blank')">Buy Direct</button>
  <button onclick='addToShowcase(top10[${i}])'>Reserve with TagShop</button>
 </div>`;
 });
}

function checkout(){
 window.open(WISE);
 thanks.style.display="block";
}

renderTop10();
</script>
</body>
</html>
