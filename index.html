<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TagShop – Luxury Watch Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --gold:#d4af37;
  --glass:rgba(15,15,15,0.75);
}

body {
  margin:0;
  font-family:Montserrat;
  color:#fff;
  background:#000;
}

/* HERO */
.hero{
  background:url("https://images.unsplash.com/photo-1518544887872-2ed0d3a2fdb5?auto=format&fit=crop&w=1600&q=80") center/cover no-repeat;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.65);
}
.hero-content{
  position:relative;
  max-width:1000px;
  background:var(--glass);
  padding:60px;
  border-radius:18px;
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,215,0,.3);
}
.hero h1{
  font-family:Playfair Display;
  color:var(--gold);
  font-size:3rem;
}
.hero p{font-size:1.1rem;opacity:.9;}
.hero .cta{
  margin-top:20px;
  background:linear-gradient(135deg,#f5d77c,#b28d29);
  color:#000;
  padding:15px 40px;
  border-radius:30px;
  display:inline-block;
  font-weight:700;
  text-decoration:none;
}

/* Sections */
.section{
  padding:60px 20px;
  max-width:1200px;
  margin:auto;
}
.glass{
  background:var(--glass);
  border-radius:15px;
  padding:30px;
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,215,0,.25);
}

/* Search */
input{
  padding:12px;
  width:100%;
  max-width:500px;
  border:none;
  border-radius:30px;
}
button{
  background:var(--gold);
  border:none;
  padding:12px 25px;
  border-radius:30px;
  font-weight:700;
  cursor:pointer;
}

/* Products */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.card{
  background:rgba(0,0,0,.75);
  padding:15px;
  border-radius:15px;
  border:1px solid rgba(255,215,0,.2);
}
.card img{width:100%;border-radius:10px;}
.card h4{color:var(--gold);}
.buy-dh{background:#333;color:#fff;}
.buy-ts{background:var(--gold);color:#000;margin-top:6px;width:100%}

/* Checkout */
#checkout{display:none;margin-top:40px;}
input,textarea{margin:6px 0;}
</style>
</head>

<body>

<div class="hero">
  <div class="hero-content">
    <h1>TagShop Luxury Watches</h1>
    <p>Hand-selected Rolex-style timepieces. UK price. Insured delivery. Authentic markings.</p>
    <p><strong>Buy direct or Buy with Confidence via TagShop.</strong></p>
    <a href="#search" class="cta">Browse Watches</a>
  </div>
</div>

<div class="section glass" id="search">
<h2>Search DHgate Watches</h2>
<input id="q" placeholder="Search luxury watches...">
<button onclick="search()">Search</button>
<p>
<button onclick="quick('Mens watches')">Men’s Watches</button>
<button onclick="quick('Rolex style watch')">Rolex Style</button>
<button onclick="quick('Watch with box')">With Box</button>
<button onclick="quick('Luxury chronograph')">Chronograph</button>
</p>
</div>

<div class="section">
<h2>Search Results</h2>
<div id="results" class="grid"></div>
</div>

<div class="section">
<h2>Your Showcase</h2>
<div id="showcase" class="grid"></div>
</div>

<div class="section glass" id="checkout">
<h2>Delivery & Checkout</h2>
<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Phone">
<textarea id="addr" placeholder="Delivery Address"></textarea>
<button onclick="pay()">Proceed to Secure Wise Payment</button>
<p id="thanks" style="display:none;color:var(--gold)">Thank you! A confirmation email has been sent.</p>
</div>

<script>
const API="AIzaSyB9YwW8EVXQJsVwSMbJrk-NU9B9ZrzzkGs";
const CX="f7e219616fe1d4629";
const AFF="2545671";
const WISE="https://wise.com/pay/me/davids14542";

let last=[]; let showcase=[];

function quick(q){document.getElementById("q").value=q;search();}

async function search(){
 let q=document.getElementById("q").value;
 let r=await fetch(`https://www.googleapis.com/customsearch/v1?q=${encodeURIComponent(q)}&cx=${CX}&key=${API}`);
 let d=await r.json();
 let res=d.items.filter(i=>i.link.includes("dhgate"));
 last=res.map(i=>({
   title:i.title, img:i.pagemap?.cse_image?.[0]?.src||"", 
   link:i.link.includes("?")?i.link+"&aff="+AFF:i.link+"?aff="+AFF
 }));
 render(res,"results",true);
}

function render(arr,id,add){
 let box=document.getElementById(id); box.innerHTML="";
 arr.forEach((p,i)=>{
  let d=document.createElement("div"); d.className="card";
  d.innerHTML=`
   <img src="${p.img}">
   <h4>${p.title}</h4>
   <button class="buy-dh" onclick="window.open('${p.link}')">Buy on DHgate</button>
   <button class="buy-ts" onclick="add(${i})">Buy via TagShop</button>`;
  box.appendChild(d);
 });
}

function add(i){
 let p=last[i];
 showcase.push(p);
 render(showcase,"showcase",false);
 document.getElementById("checkout").style.display="block";
}

function pay(){
 document.getElementById("thanks").style.display="block";
 window.open(WISE);
}
</script>

</body>
</html>
