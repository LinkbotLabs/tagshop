<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TagShop – Luxury Watch Concierge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#f5d77c;
  --glass:rgba(20,20,20,.55);
  --diamond:linear-gradient(145deg,#fff,#f5d77c,#caa54d);
}
body{margin:0;font-family:Montserrat;background:#000;color:#fff;overflow-x:hidden}
h1,h2{font-family:Playfair Display;color:var(--gold)}
.section{max-width:1400px;margin:auto;padding:40px}
.glass{background:var(--glass);backdrop-filter:blur(18px);border-radius:25px;padding:30px;border:1px solid rgba(255,215,0,.35)}

/* HERO */
.hero-bg{position:fixed;inset:0;z-index:-2}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.15),rgba(0,0,0,.85))}
.hero-bg img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0;animation:fade 60s infinite}
.hero-bg img:nth-child(1){animation-delay:0s}
.hero-bg img:nth-child(2){animation-delay:6s}
.hero-bg img:nth-child(3){animation-delay:12s}
.hero-bg img:nth-child(4){animation-delay:18s}
.hero-bg img:nth-child(5){animation-delay:24s}
.hero-bg img:nth-child(6){animation-delay:30s}
.hero-bg img:nth-child(7){animation-delay:36s}
.hero-bg img:nth-child(8){animation-delay:42s}
.hero-bg img:nth-child(9){animation-delay:48s}
.hero-bg img:nth-child(10){animation-delay:54s}
@keyframes fade{0%{opacity:0}5%{opacity:1}20%{opacity:1}25%{opacity:0}100%{opacity:0}}

/* CAROUSELS */
#results,#top10{
  display:flex;
  gap:20px;
  overflow-x:auto;
  padding:20px 0;
  scroll-snap-type:x mandatory;
}
#results>*,#top10>*{scroll-snap-align:start}
#results::-webkit-scrollbar,#top10::-webkit-scrollbar{height:8px}
#results::-webkit-scrollbar-thumb,#top10::-webkit-scrollbar-thumb{background:var(--gold);border-radius:10px}

/* CARDS */
.card{
  background:rgba(255,255,255,.08);
  border-radius:20px;
  padding:15px;
  border:1px solid rgba(255,215,0,.3);
  min-width:200px;
  max-width:200px;
  transition:.4s;
  position:relative;
}
.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px rgba(245,215,124,.8);
}
.card img{
  width:180px;height:180px;
  object-fit:contain;
  background:#fff;
  border-radius:12px;
  padding:8px;
  transition:.5s;
}
.card:hover img{transform:scale(1.25)}

.badge{
  background:var(--gold);
  color:#000;
  padding:4px 10px;
  border-radius:20px;
  font-size:.75rem;
}

/* BUTTONS */
button{
  width:100%;
  border:none;
  padding:10px;
  border-radius:30px;
  font-weight:700;
  margin-top:8px;
  background:var(--diamond);
  cursor:pointer;
  box-shadow:0 0 12px rgba(245,215,124,.6);
}
button:hover{
  box-shadow:0 0 25px rgba(255,255,255,.9),0 0 35px rgba(245,215,124,1);
}
.buy{background:#111;color:#fff}

.nav{text-align:center}
.nav button{width:auto;padding:8px 25px}
</style>
</head>

<body>

<div class="hero-bg">
<img src="https://images.unsplash.com/photo-1612817159949-195b6eb9e31a">
<img src="https://images.unsplash.com/photo-1601924638867-3ec62b5d35a1">
<img src="https://images.unsplash.com/photo-1599940824399-b87987ceb72a">
<img src="https://images.unsplash.com/photo-1519741497674-611481863552">
<img src="https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3">
<img src="https://images.unsplash.com/photo-1611080626919-7cf5a9dbab5a">
<img src="https://images.unsplash.com/photo-1600087626014-e652e18bbff2">
<img src="https://images.unsplash.com/photo-1612817159954-5e36bcbf7b92">
<img src="https://images.unsplash.com/photo-1547996160-81dfa63595aa">
<img src="https://images.unsplash.com/photo-1612293974874-327fa21c5f1b">
</div>

<div class="section glass">
<h1>TagShop Luxury Watch Concierge</h1>
<p>Dealer-verified luxury timepieces with correct weight, markings and UK delivery.</p>
<input id="q" placeholder="Search Rolex, Omega, Patek, AP, TAG Heuer…">
<button onclick="search()">Search Dealer Network</button>
</div>

<div class="section">
<h2>🏆 TagShop Top 10 Picks</h2>
<div id="top10"></div>
</div>

<div class="section">
<div class="nav">
<button onclick="prevPage()">◀</button>
<span id="pageInfo">Page 1</span>
<button onclick="nextPage()">▶</button>
</div>
<div id="results"></div>
</div>

<div class="section">
<h2>Your Reserved Watches</h2>
<div id="showcase"></div>
</div>

<script>
const API="AIzaSyB9YwW8EVXQJsVwSMbJrk-NU9B9ZrzzkGs";
const CX="f7e219616fe1d4629";
const AFF="2545671";

let startIndex=1,last=[],showcase=[];
let top10=JSON.parse(localStorage.getItem("top10")||"[]");

function dealerScore(t){
 t=t.toLowerCase();let s=0;
 if(t.includes("aaa"))s+=3;
 if(t.includes("box"))s+=2;
 if(t.includes("papers"))s+=2;
 if(t.includes("sapphire"))s+=2;
 if(t.includes("904l"))s+=3;
 if(t.includes("automatic"))s+=2;
 return s;
}

async function search(){startIndex=1;fetchResults()}
async function fetchResults(){
 const r=await fetch(`https://www.googleapis.com/customsearch/v1?q=${encodeURIComponent(q.value)}&cx=${CX}&key=${API}&start=${startIndex}`);
 const d=await r.json();
 last=d.items.filter(i=>i.link.includes("dhgate")).map(i=>{
  return{
   title:i.title,
   img:i.pagemap?.cse_image?.[0]?.src || "https://i.imgur.com/JbGQH6g.png",
   link:i.link.includes("?")?i.link+"&aff="+AFF:i.link+"?aff="+AFF,
   score:dealerScore(i.title)
  }
 }).sort((a,b)=>b.score-a.score);
 renderResults();
 pageInfo.innerText="Page "+Math.ceil(startIndex/10);
}

function renderResults(){
 results.innerHTML="";
 last.forEach((p,i)=>{
 results.innerHTML+=`
 <div class="card">
  <img src="${p.img}">
  <h4>${p.title}</h4>
  <div class="badge">Dealer Score ${p.score}</div>
  <button class="buy" onclick="window.open('${p.link}','_blank')">Buy Direct</button>
  <button onclick="addTop10(${i})">Add to Top 10</button>
 </div>`;
 });
}

function nextPage(){startIndex+=10;fetchResults()}
function prevPage(){if(startIndex>1){startIndex-=10;fetchResults()}}

function addTop10(i){
 if(top10.length>=10)return;
 const p=last[i];
 if(top10.find(x=>x.link===p.link))return;
 top10.push(p);
 localStorage.setItem("top10",JSON.stringify(top10));
 renderTop10();
}

function addToShowcase(p){
 if(showcase.find(x=>x.link===p.link))return;
 showcase.push(p);
 document.getElementById("showcase").innerHTML+=`
 <div class="card"><img src="${p.img}"><h4>${p.title}</h4><div style="color:#f5d77c">£299</div></div>`;
}

function renderTop10(){
 const c=document.getElementById("top10");
 c.innerHTML="";
 top10.forEach((p,i)=>{
  c.innerHTML+=`
   <div class="card">
    <img src="${p.img}">
    <h4>${p.title}</h4>
    <div class="badge">TagShop Verified</div>
    <div style="color:#f5d77c">£299</div>
    <button class="buy" onclick="window.open('${p.link}','_blank')">Buy Direct</button>
    <button onclick="addToShowcase(top10[${i}])">Reserve with TagShop</button>
   </div>`;
 });
}
renderTop10();
</script>
</body>
</html>
