<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TagShop – Luxury Watch Concierge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#f5d77c;
  --glass:rgba(30,30,30,.55);
  --diamond:linear-gradient(145deg,#fff,#f5d77c,#caa54d);
}
body{margin:0;font-family:Montserrat;background:#050505;color:#fff;}
h1,h2{font-family:Playfair Display;color:var(--gold);}
input,textarea{width:100%;padding:12px;border-radius:10px;border:none;margin:6px 0}

.hero-bg{position:fixed;inset:0;z-index:-2}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3),rgba(0,0,0,.8))}
.hero-bg img{position:absolute;width:100%;height:100%;object-fit:cover;animation:fade 30s infinite;opacity:0}
.hero-bg img:nth-child(1){animation-delay:0s}
.hero-bg img:nth-child(2){animation-delay:6s}
.hero-bg img:nth-child(3){animation-delay:12s}
.hero-bg img:nth-child(4){animation-delay:18s}
.hero-bg img:nth-child(5){animation-delay:24s}
@keyframes fade{0%{opacity:0}5%{opacity:1}20%{opacity:1}25%{opacity:0}100%{opacity:0}}

.section{max-width:1200px;margin:auto;padding:30px 20px}
.glass{background:var(--glass);backdrop-filter:blur(16px);border-radius:20px;padding:25px;border:1px solid rgba(255,215,0,.3)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:25px}
.card{background:rgba(255,255,255,.08);border-radius:18px;padding:15px;border:1px solid rgba(255,215,0,.25)}
.card img{width:100%;height:200px;object-fit:contain;background:#fff;border-radius:12px;padding:10px}

button{width:100%;background:var(--diamond);border:none;padding:12px;border-radius:30px;font-weight:700;margin-top:8px;cursor:pointer}
.buy-dh{background:#111;color:#fff}

#results{display:flex;gap:20px;overflow-x:auto;padding-bottom:15px}

#cartBar{position:fixed;bottom:20px;right:20px;background:var(--glass);backdrop-filter:blur(12px);padding:15px 25px;border-radius:30px;border:1px solid rgba(255,215,0,.4);display:none}
.nav{text-align:center}
.nav button{width:auto;padding:10px 25px}
</style>
</head>

<body>

<div class="hero-bg">
<img src="https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3?auto=format&fit=crop&w=1600&q=80">
<img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1600&q=80">
<img src="https://images.unsplash.com/photo-1601924638867-3ec62b5d35a1?auto=format&fit=crop&w=1600&q=80">
<img src="https://images.unsplash.com/photo-1599940824399-b87987ceb72a?auto=format&fit=crop&w=1600&q=80">
<img src="https://images.unsplash.com/photo-1612817159949-195b6eb9e31a?auto=format&fit=crop&w=1600&q=80">
</div>

<div class="section glass">
<h1>TagShop Luxury Watch Concierge</h1>
<p>Hand-selected AAA luxury timepieces — shipped fast to the UK.</p>
<input id="q" placeholder="Search Rolex, AP, Patek, Omega, Breitling">
<button onclick="search()">Search Dealer Network</button>
</div>

<div class="section">
<h2>Top 10 TagShop Picks</h2>
<div id="top10" class="grid"></div>
</div>

<div class="section">
<div class="nav">
<button onclick="prevPage()">◀</button>
<span id="pageInfo">Page 1</span>
<button onclick="nextPage()">▶</button>
</div>
<div id="results"></div>
</div>

<div class="section">
<h2>Your Curated Selection</h2>
<div id="showcase" class="grid"></div>
</div>

<div class="section glass" id="checkout" style="display:none">
<h2>Secure Checkout</h2>
<input placeholder="Full Name">
<input placeholder="Email">
<textarea placeholder="Delivery Address"></textarea>
<button onclick="pay()">Pay with Wise</button>
<p id="thanks" style="display:none;color:var(--gold)">Order confirmed.</p>
</div>

<div id="cartBar">🛒 <span id="cartCount">0</span> • £<span id="cartTotal">0</span></div>

<script>
const API="AIzaSyB9YwW8EVXQJsVwSMbJrk-NU9B9ZrzzkGs";
const CX="f7e219616fe1d4629";
const AFF="2545671";
const PRICE=249;
const WISE="https://wise.com/pay/me/davids14542";

let startIndex=1,last=[],showcase=[];
let top10=JSON.parse(localStorage.getItem("top10")||"[]");

function saveTop10(){localStorage.setItem("top10",JSON.stringify(top10));renderTop10()}

function score(t){
 t=t.toLowerCase();
 let s=0;
 if(t.includes("aaa"))s+=3;
 if(t.includes("box"))s+=2;
 if(t.includes("papers"))s+=2;
 if(t.includes("sapphire"))s+=2;
 if(t.includes("904l"))s+=3;
 if(t.includes("automatic"))s+=2;
 return s;
}

async function search(){
 const r=await fetch(`https://www.googleapis.com/customsearch/v1?q=${encodeURIComponent(q.value)}&cx=${CX}&key=${API}&start=${startIndex}`);
 const d=await r.json();
 last=d.items.filter(i=>i.link.includes("dhgate")).map(i=>({
  title:i.title,img:i.pagemap?.cse_image?.[0]?.src||"",link:i.link,score:score(i.title)
 })).sort((a,b)=>b.score-a.score);
 renderResults();
}

function renderResults(){
 results.innerHTML="";
 last.forEach((p,i)=>{
  results.innerHTML+=`
  <div class="card">
   <img src="${p.img}">
   <h4>${p.title}</h4>
   <p>£${PRICE}</p>
   <button class="buy-dh" onclick="window.open('${p.link}')">Buy Direct</button>
   <button onclick="addTop(${i})">Add to Top 10</button>
  </div>`;
 });
}

function addTop(i){
 if(top10.find(x=>x.link===last[i].link))return;
 if(top10.length>=10)top10.shift();
 top10.push(last[i]);
 saveTop10();
}

function renderTop10(){
 top10Box=document.getElementById("top10");
 top10Box.innerHTML="";
 top10.forEach((p,i)=>{
  top10Box.innerHTML+=`
  <div class="card">
   <img src="${p.img}">
   <h4>${p.title}</h4>
   <p>£${PRICE}</p>
   <button onclick="addShowcase(${i})">Add to Checkout</button>
  </div>`;
 });
}

function addShowcase(i){
 const p=top10[i];
 if(showcase.find(x=>x.link===p.link))return;
 showcase.push(p);
 renderShowcase();
}

function renderShowcase(){
 s=document.getElementById("showcase");
 s.innerHTML="";
 showcase.forEach(p=>{
  s.innerHTML+=`<div class="card"><img src="${p.img}"><h4>${p.title}</h4><p>£${PRICE}</p></div>`;
 });
 cartBar.style.display="block";
 cartCount.innerText=showcase.length;
 cartTotal.innerText=showcase.length*PRICE;
 checkout.style.display="block";
}

function pay(){thanks.style.display="block";window.open(WISE)}
renderTop10();
</script>

</body>
</html>
