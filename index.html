<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TagShop – Luxury Watch Concierge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{--gold:#f5d77c;--glass:rgba(0,0,0,.6);--diamond:linear-gradient(145deg,#fff,#f5d77c,#caa54d)}
body{margin:0;font-family:Montserrat;background:#000;color:#fff}
h1,h2{font-family:Playfair Display;color:var(--gold)}
.hero-bg{position:fixed;inset:0;z-index:-2}
.hero-bg img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0;animation:fade 30s infinite}
.hero-bg img:nth-child(1){animation-delay:0s}
.hero-bg img:nth-child(2){animation-delay:6s}
.hero-bg img:nth-child(3){animation-delay:12s}
.hero-bg img:nth-child(4){animation-delay:18s}
.hero-bg img:nth-child(5){animation-delay:24s}
@keyframes fade{0%{opacity:0}10%{opacity:1}20%{opacity:1}30%{opacity:0}100%{opacity:0}}
.section{max-width:1200px;margin:auto;padding:25px}
.glass{background:var(--glass);backdrop-filter:blur(16px);border-radius:20px;padding:25px;border:1px solid rgba(255,215,0,.3)}
#results{display:flex;gap:20px;overflow-x:auto;padding-bottom:10px}
.card{background:rgba(255,255,255,.08);border-radius:15px;padding:15px;min-width:220px;border:1px solid rgba(255,215,0,.25)}
.card img{width:100%;height:200px;object-fit:contain;background:#fff;border-radius:10px}
button{background:var(--diamond);border:none;padding:10px;border-radius:30px;width:100%;margin-top:10px;font-weight:700}
.buy{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
#cartBar{position:fixed;bottom:15px;right:15px;background:var(--glass);padding:15px 25px;border-radius:30px;display:none}
</style>
</head>

<body>

<div class="hero-bg">
<img src="https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3?auto=format&w=1600&q=80">
<img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&w=1600&q=80">
<img src="https://images.unsplash.com/photo-1601924638867-3ec62b5d35a1?auto=format&w=1600&q=80">
<img src="https://images.unsplash.com/photo-1599940824399-b87987ceb72a?auto=format&w=1600&q=80">
<img src="https://images.unsplash.com/photo-1612817159949-195b6eb9e31a?auto=format&w=1600&q=80">
</div>

<div class="section glass">
<h1>TagShop Luxury Watch Concierge</h1>
<p>We source premium replicas & best dealer watches with box, papers and UK delivery.</p>
<input id="q" placeholder="Search Rolex, AP, Boxed, AAA…" style="width:100%;padding:10px;border-radius:10px">
<button onclick="search()">Search Dealer Network</button>
</div>

<div class="section"><div id="results"></div></div>

<div class="section">
<h2>Your Curated Selection</h2>
<div id="showcase" class="grid"></div>
</div>

<div class="section glass" id="checkout" style="display:none">
<button onclick="pay()">Pay with Wise</button>
<p id="thanks" style="display:none;color:var(--gold)">Order confirmed.</p>
</div>

<div id="cartBar"><span id="cartCount">0</span> watches • <span id="cartTotal">£0</span></div>

<script>
const API="AIzaSyB9YwW8EVXQJsVwSMbJrk-NU9B9ZrzzkGs";
const CX="f7e219616fe1d4629";
const AFF="2545671";
const WISE="https://wise.com/pay/me/davids14542";

const fallback=[...Array(50)].map((_,i)=>({
  title:["Rolex","AP","Omega","Breitling","Cartier","Tag Heuer","IWC","Hublot"][i%8]+" Luxury Watch",
  img:`https://source.unsplash.com/600x600/?luxury,watch,${i}`,
  price:i%3==0?250:150,
  link:"#"
}));

let results=[],cart=[];

window.onload=()=>render(fallback);

async function search(){
const q=document.getElementById("q").value;
try{
const r=await fetch(`https://www.googleapis.com/customsearch/v1?q=${encodeURIComponent(q+" dhgate watch")}&cx=${CX}&key=${API}`);
const d=await r.json();
results=d.items.map(i=>({
  title:i.title,
  img:i.pagemap?.cse_image?.[0]?.src||fallback[0].img,
  price:250,
  link:i.link+(i.link.includes("?")?"&":"?")+"aff="+AFF
}));
render(results);
}catch{render(fallback);}
}

function render(list){
const r=document.getElementById("results");r.innerHTML="";
list.forEach((p,i)=>{
r.innerHTML+=`<div class=card><img src="${p.img}"><h4>${p.title}</h4><b>£${p.price}</b><button onclick="add(${i})">Add</button><button class=buy onclick="window.open('${p.link}')">Buy</button></div>`;
});
results=list;
}

function add(i){
cart.push(results[i]);
document.getElementById("checkout").style.display="block";
document.getElementById("cartBar").style.display="block";
document.getElementById("cartCount").innerText=cart.length;
document.getElementById("cartTotal").innerText="£"+cart.reduce((s,p)=>s+p.price,0);
}

function pay(){
window.open(WISE);
document.getElementById("thanks").style.display="block";
}
</script>

</body>
</html>
