<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tagshop – Men’s Watches UK</title>

<style>
:root{
 --bg:#000;
 --card:#111;
 --border:#222;
 --text:#fff;
 --accent:#00ffff;
 --gold:#ffe169;
}

body{
 margin:0;
 font-family:system-ui;
 background:var(--bg);
 color:var(--text);
}

header{
 position:sticky;
 top:0;
 background:#000;
 border-bottom:1px solid var(--border);
 padding:12px;
 z-index:10;
}

h1{
 margin:0;
 text-align:center;
 color:var(--gold);
 font-size:20px;
}

.notice{
 text-align:center;
 font-size:12px;
 color:#aaa;
 margin-top:4px;
}

main{
 padding:10px;
}

.buybar{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#000;
 border-top:1px solid var(--border);
 padding:10px;
 display:flex;
 gap:10px;
 z-index:20;
}

.buybar button{
 flex:1;
 background:var(--accent);
 color:#000;
 font-weight:800;
 border:none;
 border-radius:12px;
 padding:14px;
 font-size:16px;
 cursor:pointer;
}

.how{
 padding:12px;
 border-top:1px solid var(--border);
 font-size:13px;
 line-height:1.6;
 color:#ccc;
}

iframe{
 width:100%;
 border:none;
 min-height:70vh;
}
</style>
</head>

<body>

<header>
  <h1>🕰️ Tagshop – Men’s Watches</h1>
  <div class="notice">
    Premium DHgate watches • UK delivery • 30% concierge included
  </div>
</header>

<main>

<!-- Google Programmable Search (DHgate Only) -->
<script async src="https://cse.google.com/cse.js?cx=f7e219616fe1d4629"></script>
<div class="gcse-searchresults-only"></div>

<div class="how">
<b>How it works</b><br>
1. Browse DHgate men’s watches above<br>
2. Open a product you like<br>
3. Copy the product link<br>
4. Tap <b>Buy via Tagshop</b><br>
5. Pay via Wise — we order & ship to you 🇬🇧
</div>

</main>

<!-- Checkout Bar -->
<div class="buybar">
  <button onclick="checkout()">Buy via Tagshop</button>
</div>

<script>
const WISE = "https://wise.com/pay/me/davids14542";

function checkout(){
 const msg = encodeURIComponent(
  "Tagshop Watch Order\n\n" +
  "Please paste the DHgate product link below:\n\n" +
  "UK delivery included.\n" +
  "Price includes 30% concierge service.\n\n" +
  "Product link:"
 );
 window.open(WISE + "?message=" + msg, "_blank");
}
</script>

</body>
</html>
