<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TagShop – Private Watch Exchange</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#050505;
  color:#f5d77c;
  font-family:Montserrat,sans-serif;
  overflow-x:hidden;
}
h1,h2,h3{font-family:'Playfair Display',serif;}

.section{
  max-width:1200px;
  margin:auto;
  padding:60px 20px;
}

/* HERO */
.hero-bg{
  position:fixed;
  inset:0;
  z-index:-2;
}
.hero-bg img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  animation:fade 30s infinite;
}
.hero-bg img:nth-child(1){animation-delay:0s}
.hero-bg img:nth-child(2){animation-delay:6s}
.hero-bg img:nth-child(3){animation-delay:12s}
.hero-bg img:nth-child(4){animation-delay:18s}
.hero-bg img:nth-child(5){animation-delay:24s}

@keyframes fade{
  0%{opacity:0}
  5%{opacity:1}
  20%{opacity:1}
  25%{opacity:0}
}

.hero-bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 30%, rgba(255,215,140,.15), rgba(0,0,0,.9)),
    linear-gradient(to bottom, rgba(0,0,0,.4), rgba(0,0,0,.95));
}

.hero-text{
  text-align:center;
  padding-top:140px;
}

/* CAROUSEL */
#showcase{overflow:hidden;}
.carousel-track{
  display:flex;
  gap:30px;
  transition:.6s cubic-bezier(.4,0,.2,1);
}

.card{
  min-width:280px;
  background:rgba(255,255,255,.05);
  border-radius:20px;
  padding:15px;
  box-shadow:0 0 25px rgba(0,0,0,.6);
}

.card img{
  width:100%;
  height:240px;
  object-fit:contain;
  background:#fff;
  border-radius:14px;
  padding:10px;
}

.card h4{margin:10px 0 5px}
.card p{font-size:.9em;line-height:1.4}

button{
  width:100%;
  margin-top:8px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#f5d77c;
  color:#000;
  font-weight:600;
}
</style>
</head>

<body>

<div class="hero-bg">
<img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=1600&q=80">
<img src="https://images.unsplash.com/photo-1609587312208-cea54be969e7?auto=format&fit=crop&w=1600&q=80">
<img src="https://images.unsplash.com/photo-1587836374828-4db7f7d6d2c6?auto=format&fit=crop&w=1600&q=80">
<img src="https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=1600&q=80">
<img src="https://images.unsplash.com/photo-1612817159949-195b6eb9e31a?auto=format&fit=crop&w=1600&q=80">
</div>

<div class="section hero-text">
<h1>TagShop Private Watch Exchange</h1>
<p>Curated Timepieces • Verified Batches • Collector-Grade</p>
</div>

<div class="section">
<div id="showcase">
  <div class="carousel-track" id="carouselTrack"></div>
</div>
</div>

<script>
const WISE="https://wise.com/pay/me/davids14542";
const SHOP_KEY="tagshopShop";

let shop = JSON.parse(localStorage.getItem(SHOP_KEY) || "[]");
let index = 0;

function render(){
  const track = document.getElementById("carouselTrack");
  track.innerHTML = "";

  if(shop.length===0){
    track.innerHTML = "<p style='padding:40px;color:#fff'>No watches in shop yet.</p>";
    return;
  }

  shop.forEach(p=>{
    const d=document.createElement("div");
    d.className="card";
    d.innerHTML=`
      <img src="${p.img}">
      <h4>${p.title}</h4>
      <p>
        <b>TagShop Certified</b><br>
        Supplier £${p.supplierPrice} → TagShop £${p.tagshopPrice}
      </p>
      <button onclick="window.open('${p.link}')">Supplier Listing</button>
      <button onclick="window.open('${WISE}')">Buy Securely</button>
    `;
    track.appendChild(d);
  });
}

render();
</script>

</body>
</html>
