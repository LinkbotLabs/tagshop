<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DHgate Affiliate Store</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    h1 { text-align: center; color: #0073e6; }
    #searchContainer { text-align: center; margin-bottom: 20px; }
    input[type="text"] { width: 300px; padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
    button { padding: 8px 12px; margin-left: 5px; border-radius: 5px; border: none; background: #0073e6; color: #fff; cursor: pointer; }
    button:hover { background: #005bb5; }
    #results { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
    .product { background: #fff; padding: 10px; border-radius: 5px; width: 220px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); text-align: center; }
    .product img { max-width: 200px; height: auto; border-radius: 5px; }
    .product a { display: block; margin-top: 5px; font-weight: bold; color: #0073e6; text-decoration: none; }
    .product a:hover { text-decoration: underline; }
    .pagination { text-align: center; margin-top: 20px; }
    .pagination button { margin: 0 5px; }
  </style>
</head>
<body>
  <h1>DHgate Affiliate Store</h1>
  <div id="searchContainer">
    <input type="text" id="searchQuery" placeholder="Search for products..." />
    <button onclick="searchProducts()">Search</button>
  </div>
  <div id="results"></div>
  <div class="pagination">
    <button onclick="prevPage()" id="prevBtn" disabled>Previous</button>
    <button onclick="nextPage()" id="nextBtn" disabled>Next</button>
  </div>

  <script>
    const API_KEY = "AIzaSyB9YwW8EVXQJsVwSMbJrk-NU9B9ZrzzkGs";
    const CSE_ID = "f7e219616fe1d4629";
    const DHGATE_AFFILIATE_ID = "2545671";
    let currentQuery = '';
    let startIndex = 1; // Google CSE starts indexing at 1
    let lastResults = [];

    async function searchProducts() {
      const queryInput = document.getElementById('searchQuery').value.trim();
      if (!queryInput) return alert("Please enter a search term.");

      currentQuery = queryInput;
      startIndex = 1; // reset page on new search
      await fetchResults();
    }

    async function fetchResults() {
      const url = `https://www.googleapis.com/customsearch/v1?q=${encodeURIComponent(currentQuery)}&cx=${CSE_ID}&key=${API_KEY}&start=${startIndex}`;
      
      try {
        const response = await fetch(url);
        const data = await response.json();

        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';
        lastResults = [];

        if (!data.items || data.items.length === 0) {
          resultsDiv.innerHTML = '<p>No DHgate products found.</p>';
          document.getElementById('prevBtn').disabled = true;
          document.getElementById('nextBtn').disabled = true;
          return;
        }

        // Filter DHgate links
        const dhgateResults = data.items
          .filter(item => item.link.includes("dhgate.com"))
          .map(item => {
            let link = item.link.includes("?") ? `${item.link}&aff=${DHGATE_AFFILIATE_ID}` : `${item.link}?aff=${DHGATE_AFFILIATE_ID}`;
            return {
              title: item.title,
              snippet: item.snippet,
              link,
              image: item.pagemap?.cse_image ? item.pagemap.cse_image[0].src : ''
            };
          });

        lastResults = dhgateResults;

        if (dhgateResults.length === 0) {
          resultsDiv.innerHTML = '<p>No DHgate links found in these results.</p>';
        } else {
          dhgateResults.forEach(item => {
            const div = document.createElement('div');
            div.className = 'product';
            div.innerHTML = `
              ${item.image ? `<img src="${item.image}" alt="${item.title}" />` : ''}
              <a href="${item.link}" target="_blank">${item.title}</a>
              <p>${item.snippet}</p>
            `;
            resultsDiv.appendChild(div);
          });
        }

        // Pagination buttons
        document.getElementById('prevBtn').disabled = startIndex <= 1;
        document.getElementById('nextBtn').disabled = !data.queries?.nextPage;

      } catch (error) {
        console.error(error);
        alert("Error fetching results. Check console for details.");
      }
    }

    function nextPage() {
      startIndex += 10; // next 10 results
      fetchResults();
    }

    function prevPage() {
      startIndex = Math.max(1, startIndex - 10);
      fetchResults();
    }
  </script>
</body>
</html>
