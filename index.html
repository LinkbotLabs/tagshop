<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TagShop • Private Luxury Watch Concierge</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050505;
      --text: #e8d9a6;
      --gold: #f5d77c;
      --gold-dark: #d4b45c;
      --card: rgba(255,255,255,0.06);
      --card-hover: rgba(255,255,255,0.11);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    h1, h2, h3 {
      font-family: 'Playfair Display', serif;
      color: var(--gold);
      letter-spacing: 0.5px;
    }

    .hero-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
    }
    .hero-bg img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
      animation: crossfade 60s infinite;
    }
    .hero-bg img:nth-child(1) { animation-delay: 0s; }
    .hero-bg img:nth-child(2) { animation-delay: 12s; }
    .hero-bg img:nth-child(3) { animation-delay: 24s; }
    .hero-bg img:nth-child(4) { animation-delay: 36s; }
    .hero-bg img:nth-child(5) { animation-delay: 48s; }

    @keyframes crossfade {
      0%   { opacity: 0; }
      5%   { opacity: 1; }
      20%  { opacity: 1; }
      25%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 25%, rgba(245,215,140,0.12), transparent 40%),
                  linear-gradient(to bottom, rgba(5,5,5,0.45), rgba(5,5,5,0.95) 70%);
      z-index: -1;
    }

    header {
      text-align: center;
      padding: 80px 20px 40px;
    }
    header h1 {
      font-size: 3.6rem;
      margin-bottom: 0.2em;
    }
    header p {
      font-size: 1.1rem;
      opacity: 0.8;
      max-width: 680px;
      margin: 0 auto;
    }

    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    .search-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 40px 0 60px;
    }
    input[type="text"], button {
      padding: 14px 20px;
      font-size: 1.05rem;
      border: none;
      border-radius: 12px;
    }
    input[type="text"] {
      flex: 1;
      min-width: 320px;
      background: rgba(255,255,255,0.08);
      color: white;
    }
    button {
      background: var(--gold);
      color: black;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
    }
    button:hover { background: var(--gold-dark); transform: translateY(-1px); }

    .nav {
      text-align: center;
      margin: 30px 0;
      font-weight: 500;
    }
    .nav button {
      width: auto;
      padding: 10px 24px;
      margin: 0 8px;
      background: rgba(245,215,124,0.15);
      color: var(--gold);
    }

    .stats {
      text-align: center;
      margin: 20px 0 40px;
      font-size: 0.95rem;
      opacity: 0.8;
    }

    .section-title {
      text-align: center;
      font-size: 2.4rem;
      margin: 70px 0 40px;
      position: relative;
    }
    .section-title::after {
      content: "";
      width: 80px;
      height: 2px;
      background: var(--gold);
      opacity: 0.4;
      display: block;
      margin: 12px auto 0;
    }

    .carousel {
      overflow: hidden;
      position: relative;
    }
    .carousel-track {
      display: flex;
      gap: 28px;
      transition: transform 0.7s cubic-bezier(0.25, 0.1, 0.25, 1);
      padding: 20px 0;
    }

    .card {
      flex: 0 0 300px;
      background: var(--card);
      border-radius: 20px;
      padding: 18px;
      backdrop-filter: blur(8px);
      transition: all 0.35s;
      border: 1px solid rgba(245,215,124,0.08);
    }
    .card:hover {
      transform: translateY(-10px);
      background: var(--card-hover);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .card img {
      width: 100%;
      height: 240px;
      object-fit: contain;
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .card h4 {
      font-size: 1.15rem;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .card .highlight {
      color: #ffeb3b;
      font-weight: 600;
      font-size: 0.9rem;
      margin: 6px 0;
    }
    .card .price {
      color: var(--gold);
      font-weight: 600;
    }
    .price-input {
      width: 100%;
      margin: 10px 0 6px;
      padding: 10px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(245,215,124,0.2);
      color: white;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .btn-row button {
      flex: 1;
      font-size: 0.92rem;
      padding: 10px;
    }
    .btn-showcase { background: rgba(245,215,124,0.25); color: var(--gold); }
    .btn-shop     { background: #00ff9c; color: black; }

    @media (max-width: 900px) {
      .card { flex: 0 0 260px; }
      header h1 { font-size: 2.8rem; }
    }
  </style>
</head>
<body>

<div class="hero-bg">
  <img src="https://images.unsplash.com/photo-1612817159949-195b6eb9e31a?auto=format&fit=crop&w=2000&q=90" alt="luxury watch dark">
  <img src="https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=2000&q=90" alt="luxury watch macro">
  <img src="https://images.unsplash.com/photo-1587836374828-4db7f7d6d2c6?auto=format&fit=crop&w=2000&q=90" alt="elegant timepiece">
  <img src="https://images.unsplash.com/photo-1609587312208-cea54be969e7?auto=format&fit=crop&w=2000&q=90" alt="gold watch detail">
  <img src="https://images.unsplash.com/photo-1541783245831-57d6fb0926d3?auto=format&fit=crop&w=2000&q=90" alt="luxury watch black bg">
</div>
<div class="overlay"></div>

<header>
  <h1>TagShop</h1>
  <p>Private Luxury Watch Concierge • Curated Collector-Grade Timepieces</p>
</header>

<div class="container">

  <div class="search-bar">
    <input id="q" placeholder="Rolex Submariner, AP Royal Oak, Patek Nautilus…" autocomplete="off"/>
    <button onclick="search()">Search Network</button>
  </div>

  <div class="nav">
    <button onclick="prevPage()">◀ Previous</button>
    <span id="pageInfo">Page 1</span>
    <button onclick="nextPage()">Next ▶</button>
  </div>

  <div class="stats" id="stats">Curated: 0 • Published to Shop: 0</div>

  <div id="results" class="carousel">
    <div class="carousel-track" id="searchTrack"></div>
  </div>

  <h2 class="section-title">Private Curated Selection</h2>
  <div id="showcase" class="carousel">
    <div class="carousel-track" id="showcaseTrack"></div>
  </div>

  <h2 class="section-title">Live Shop Collection</h2>
  <div id="shopView" class="carousel">
    <div class="carousel-track" id="shopTrack"></div>
  </div>

</div>

<script>
const API_KEY = "AIzaSyB9YwW8EVXQJsVwSMbJrk-NU9B9ZrzzkGs";
const CX      = "f7e219616fe1d4629";
const AFF_TAG = "2545671";
const WISE    = "https://wise.com/pay/me/davids14542";

const SHOWCASE_KEY = "tagshopShowcase";
const SHOP_KEY     = "tagshopShop";

let currentQuery = "";
let startIndex   = 1;
let searchResults = [];

let showcase = JSON.parse(localStorage.getItem(SHOWCASE_KEY) || "[]");
let shop     = JSON.parse(localStorage.getItem(SHOP_KEY)     || "[]");

function saveShowcase() { localStorage.setItem(SHOWCASE_KEY, JSON.stringify(showcase)); updateStats(); }
function saveShop()     { localStorage.setItem(SHOP_KEY,     JSON.stringify(shop));     updateStats(); }

function updateStats() {
  document.getElementById("stats").textContent =
    `Curated: ${showcase.length} • Published to Shop: ${shop.length}`;
}

function score(title) {
  const t = title.toLowerCase();
  let s = 0;
  if (t.includes("aaa"))      s += 4;
  if (t.includes("box") || t.includes("box & papers")) s += 3;
  if (t.includes("papers"))   s += 3;
  if (t.includes("full set")) s += 4;
  if (t.includes("904l"))     s += 3;
  if (t.includes("automatic")) s += 2;
  if (t.includes("sapphire")) s += 2;
  if (t.includes("unworn"))   s += 4;
  return s;
}

async function search() {
  currentQuery = document.getElementById("q").value.trim();
  if (!currentQuery) return alert("Please enter a search term");
  startIndex = 1;
  await fetchResults();
}

async function fetchResults() {
  try {
    const url = `https://www.googleapis.com/customsearch/v1?q=${encodeURIComponent(currentQuery)}&cx=${CX}&key=${API_KEY}&start=${startIndex}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("API error");
    const data = await res.json();

    searchResults = (data.items || []).map(item => ({
      title: item.title || "Untitled Listing",
      img: item.pagemap?.cse_image?.[0]?.src || "https://via.placeholder.com/300x240/111/eee?text=No+Image",
      link: item.link.includes("?") ? item.link + "&aff=" + AFF_TAG : item.link + "?aff=" + AFF_TAG,
      score: score(item.title || "")
    })).sort((a,b) => b.score - a.score);

    renderSearchResults();
    document.getElementById("pageInfo").textContent = `Page ${Math.ceil(startIndex / 10)}`;
  } catch (e) {
    console.error(e);
    alert("Sorry, search failed. Check API key or quota.");
  }
}

function renderSearchResults() {
  const track = document.getElementById("searchTrack");
  track.innerHTML = "";

  searchResults.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${item.img}" alt="${item.title}" loading="lazy">
      <h4>${item.title}</h4>
      ${item.score >= 8 ? '<div class="highlight">★ Premium Selection</div>' : ''}
      <input type="number" class="price-input" placeholder="Supplier Price (£)" id="sup-${i}">
      <input type="number" class="price-input" placeholder="TagShop Price (£)" id="tag-${i}">
      <div class="btn-row">
        <button onclick="window.open('${item.link}','_blank')">View Dealer</button>
        <button class="btn-showcase" onclick="addToShowcase(${i})">Curate</button>
        <button class="btn-shop" onclick="addToShopFromSearch(${i})">Publish</button>
      </div>
    `;
    track.appendChild(card);
  });
}

function buildItemFromSearch(idx) {
  return {
    title: searchResults[idx].title,
    img:   searchResults[idx].img,
    link:  searchResults[idx].link,
    score: searchResults[idx].score,
    supplierPrice: parseFloat(document.getElementById(`sup-${idx}`)?.value) || 0,
    tagshopPrice:  parseFloat(document.getElementById(`tag-${idx}`)?.value) || 0
  };
}

function addToShowcase(idx) {
  const item = buildItemFromSearch(idx);
  if (showcase.some(x => x.link === item.link)) return alert("Already in curation");
  showcase.push(item);
  saveShowcase();
  renderShowcase();
}

function addToShopFromSearch(idx) {
  const item = buildItemFromSearch(idx);
  if (shop.some(x => x.link === item.link)) return alert("Already in shop");
  shop.unshift(item);
  saveShop();
  renderShop();
  alert("Published to Live Shop");
}

function addCuratedToShop(idx) {
  const item = showcase[idx];
  if (shop.some(x => x.link === item.link)) return alert("Already in shop");
  shop.unshift(item);
  saveShop();
  renderShop();
  alert("Curated piece published to Live Shop");
}

function removeFromShowcase(idx) {
  showcase.splice(idx, 1);
  saveShowcase();
  renderShowcase();
}

function renderShowcase() {
  const track = document.getElementById("showcaseTrack");
  track.innerHTML = showcase.length === 0 ? "<p style='padding:60px;text-align:center;opacity:0.6'>Your private selection is empty…</p>" : "";

  showcase.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${item.img}" alt="${item.title}" loading="lazy">
      <h4>${item.title}</h4>
      ${item.tagshopPrice ? `<p class="price">TagShop: £${item.tagshopPrice.toLocaleString()}</p>` : ''}
      <div class="btn-row">
        <button onclick="addCuratedToShop(${i})">Publish to Shop</button>
        <button style="background:#ff5252;color:white;" onclick="removeFromShowcase(${i})">Remove</button>
      </div>
    `;
    track.appendChild(card);
  });
}

function renderShop() {
  const track = document.getElementById("shopTrack");
  track.innerHTML = shop.length === 0 ? "<p style='padding:60px;text-align:center;opacity:0.6'>No pieces published yet…</p>" : "";

  shop.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${item.img}" alt="${item.title}" loading="lazy">
      <h4>${item.title}</h4>
      <p>
        <b>TagShop Certified</b><br>
        ${item.supplierPrice ? `Supplier £${item.supplierPrice.toLocaleString()} → ` : ""}
        <span class="price">£${item.tagshopPrice.toLocaleString()}</span>
      </p>
      <div class="btn-row">
        <button onclick="window.open('${item.link}','_blank')">Dealer Listing</button>
        <button onclick="window.open('${WISE}','_blank')">Secure Purchase</button>
      </div>
    `;
    track.appendChild(card);
  });
}

function nextPage() { startIndex += 10; fetchResults(); }
function prevPage() { if (startIndex > 1) { startIndex -= 10; fetchResults(); } }

// Init
updateStats();
renderShowcase();
renderShop();
</script>
</body>
</html>
