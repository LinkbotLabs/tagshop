<!DOCTYPE html>
<html>
<head>
<title>TagShop Luxury Watches</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#050505;color:#f5d77c;font-family:Montserrat}
h1{text-align:center;font-family:Playfair Display}
#grid{display:flex;gap:20px;overflow-x:auto;padding:20px}
.card{min-width:240px;background:rgba(255,255,255,.06);border-radius:18px;padding:15px}
.card img{width:100%;height:220px;object-fit:contain;background:#111;border-radius:12px;padding:10px}
button{width:100%;padding:10px;margin-top:10px;border-radius:10px;border:none;background:#f5d77c;color:#050505;font-weight:600}
</style>
</head>
<body>

<h1>TagShop Luxury Watches</h1>
<div id="grid"></div>

<script>
const WISE="https://wise.com/pay/me/davids14542";
const grid=document.getElementById("grid");

let showcase=JSON.parse(localStorage.getItem("tagshopShowcase")||"[]");

showcase.forEach((p)=>{
 const d=document.createElement("div");
 d.className="card";
 d.innerHTML=`
   <img src="${p.img}">
   <h3>${p.title}</h3>
   <p>£${p.tagshopPrice}</p>
   <button onclick="window.open('${p.link}')">Shop with Supplier</button>
   <button onclick="window.open('${WISE}')">Buy via TagShop</button>
 `;
 grid.appendChild(d);
});
</script>

</body>
</html>
