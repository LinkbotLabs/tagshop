<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TagShop – Luxury Watch Concierge | Free Shipping | Guaranteed Delivery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#f5d77c;
  --glass:rgba(25,25,25,.55);
  --diamond:linear-gradient(145deg,#fff,#f5d77c,#caa54d);
  --hoverGlow:rgba(245,215,124,.3);
}
body{margin:0;font-family:Montserrat;background:#050505;color:#fff;line-height:1.6;}
h1,h2{font-family:Playfair Display;color:var(--gold);margin-bottom:15px;}
.section{max-width:1300px;margin:auto;padding:30px}
.glass{background:var(--glass);backdrop-filter:blur(18px);border-radius:25px;padding:30px;border:1px solid rgba(255,215,0,.35)}
#results,#top10{display:flex;gap:25px;overflow-x:auto;padding:20px 0}
.card{background:rgba(255,255,255,.07);border-radius:20px;padding:15px;border:1px solid rgba(255,215,0,.3);min-width:220px;max-width:220px;position:relative;transition:transform .2s,box-shadow .2s;}
.card:hover{transform:translateY(-5px);box-shadow:0 10px 25px var(--hoverGlow);}
.card img{width:190px;height:190px;object-fit:contain;background:#fff;border-radius:12px;padding:8px}
.badge{background:var(--gold);color:#000;padding:5px 10px;border-radius:20px;font-size:.75rem;display:inline-block;margin:4px 0}
.verified{background:#00ffcc;color:#000}
.bestdeal{background:#ff0066;color:#fff}
button{width:100%;border:none;padding:12px;border-radius:30px;font-weight:700;margin-top:8px;background:var(--diamond);cursor:pointer;transition:transform .1s;}
button:hover{transform:scale(1.03);}
.buy{background:#111;color:#fff}
input{width:100%;padding:15px;border-radius:30px;border:none;margin-top:15px}
.nav{text-align:center;margin-bottom:15px}
.nav button{width:auto;padding:8px 25px;margin:0 5px}
/* Hero Section */
.hero{text-align:center; padding:50px 20px;}
.hero h1{font-size:2.5rem; line-height:1.2;}
.hero p{max-width:800px;margin:15px auto;font-size:1.1rem;color:#ddd;}
.hero-buttons{margin-top:25px; display:flex; justify-content:center; gap:15px; flex-wrap:wrap;}
.hero-buttons button{padding:15px 30px;font-size:1rem; min-width:180px;}
/* Responsive adjustments */
@media(max-width:768px){
  .card{min-width:180px;max-width:180px}
  .card img{width:160px;height:160px}
}
</style>
</head>
<body>

<!-- HERO -->
<div class="section glass hero">
  <h1>Discover Authentic Luxury Timepieces</h1>
  <p>Curated from trusted global dealers with verified stamps, serials, and original manufacturer markings — explore exceptional pieces with confidence, clarity, and transparency.</p>
  <div class="hero-buttons">
    <button onclick="document.getElementById('q').scrollIntoView({behavior:'smooth'})">Search Inventory</button>
    <button onclick="alert('Hit SEARCH above then click Buy with TagShop on a watch to start the concierge')">Concierge Service £299</button>
  </div>
</div>

<!-- TOP 10 -->
<div class="section">
<h2>🏆 TagShop Top 10 Picks</h2>
<div id="top10"></div>
</div>

<!-- SEARCH -->
<div class="section glass">
<input id="q" placeholder="Search Rolex, Omega, AP…">
<button onclick="search()">Search Market</button>
</div>

<!-- RESULTS WITH PAGINATION -->
<div class="section">
<div class="nav">
  <button onclick="prevPage()">◀ Prev</button>
  <span id="pageInfo">Page 1</span>
  <button onclick="nextPage()">Next ▶</button>
</div>
<div id="results"></div>
</div>

<!-- SHOWCASE -->
<div class="section">
<h2>Your Reserved Watches</h2>
<div id="showcase" style="display:flex;gap:20px;flex-wrap:wrap"></div>
</div>

<!-- ORDER POPUP -->
<div id="orderModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:999;display:flex;align-items:center;justify-content:center;">
<div class="glass" style="max-width:420px;width:90%;">
<h2>Reserve with TagShop – £299</h2>
<input id="custName" placeholder="Your name">
<input id="custEmail" placeholder="Your email">
<input id="custWhats" placeholder="WhatsApp">
<input id="custWatch" disabled>
<button onclick="goToWise()">Proceed to Secure Payment</button>
<button onclick="closeOrder()" class="buy">Cancel</button>
</div>
</div>

<script>
const API="AIzaSyB9YwW8EVXQJsVwSMbJrk-NU9B9ZrzzkGs";
const CX="f7e219616fe1d4629";
const AFF="2545671";
const WISE_LINK="https://wise.com/pay/me/https://wise.com/pay/me/davids14542";

let startIndex=1,last=[],showcase=[],selectedWatch=null;
let top10=JSON.parse(localStorage.getItem("top10")||"[]");

function formatPrice(p){return Math.round(p)}

// SEARCH + PAGINATION
async function search(){
    startIndex=1;
    fetchResults();
}
async function fetchResults(){
    if(!q.value) return alert("Enter search term");
    const r = await fetch(`https://www.googleapis.com/customsearch/v1?q=${encodeURIComponent(q.value)}&cx=${CX}&key=${API}&start=${startIndex}`);
    const d = await r.json();
    last = (d.items||[]).map(i=>{
        return{
            title:i.title,
            img:i.pagemap?.cse_image?.[0]?.src || "https://i.imgur.com/JbGQH6g.png",
            link:i.link.includes("?")?i.link+"&aff="+AFF:i.link+"?aff="+AFF,
            price:Math.random()*400+200
        }
    });
    renderResults();
    document.getElementById("pageInfo").innerText="Page "+Math.ceil(startIndex/10);
}

// RENDER RESULTS
function renderResults(){
    const container = document.getElementById("results");
    container.innerHTML="";
    const bestPrice = Math.min(...last.map(x=>x.price));
    last.forEach((p,i)=>{
        container.innerHTML+=`
        <div class="card">
            <img src="${p.img}">
            <h4>${p.title}</h4>
            <div class="badge verified">Verified Seller</div>
            ${p.price===bestPrice?'<div class="badge bestdeal">Best Deal</div>':''}
            <div style="color:#f5d77c">£${formatPrice(p.price)}</div>
            <button class="buy" onclick="window.open('${p.link}','_blank')">Buy Direct</button>
            <button onclick="addTop10(${i})">Add to Top 10</button>
        </div>`;
    });
}

// PAGINATION
function nextPage(){startIndex+=10;fetchResults()}
function prevPage(){if(startIndex>1){startIndex-=10;fetchResults()}}

// TOP 10
function addTop10(i){
    const p = last[i];
    if(top10.find(x=>x.link===p.link)) return;
    top10.push(p);
    localStorage.setItem("top10",JSON.stringify(top10));
    renderTop10();
}
function removeTop10(i){
    top10.splice(i,1);
    localStorage.setItem("top10",JSON.stringify(top10));
    renderTop10();
}
function renderTop10(){
    const container = document.getElementById("top10");
    container.innerHTML="";
    top10.forEach((p,i)=>{
        container.innerHTML+=`
        <div class="card">
            <img src="${p.img}">
            <h4>${p.title}</h4>
            <div class="badge verified">TagShop Verified</div>
            <div style="color:#f5d77c">£${formatPrice(p.price)}</div>
            <button class="buy" onclick="window.open('${p.link}','_blank')">Buy Direct</button>
            <button onclick="openOrder(${JSON.stringify(p).replace(/"/g,'&quot;')})">Buy with TagShop (£299)</button>
            <button onclick="removeTop10(${i})">Remove</button>
        </div>`;
    });
}

// SHOWCASE
function addToShowcase(p){
    if(showcase.find(x=>x.link===p.link)) return;
    showcase.push(p);
    renderShowcase();
}
function renderShowcase(){
    const c = document.getElementById("showcase");
    c.innerHTML="";
    showcase.forEach(p=>{
        c.innerHTML+=`
        <div class="card">
            <img src="${p.img}">
            <h4>${p.title}</h4>
            <div class="badge verified">Reserved</div>
            <div style="color:#f5d77c">£${formatPrice(p.price)}</div>
            <button class="buy" onclick="window.open('${p.link}','_blank')">Complete Purchase</button>
        </div>`;
    });
}

// ORDER MODAL
function openOrder(p){
    selectedWatch=p;
    custWatch.value=p.title;
    orderModal.style.display="flex";
}
function closeOrder(){
    orderModal.style.display="none";
}
function goToWise(){
    if(!custName.value||!custEmail.value||!custWhats.value) return alert("Fill all fields");
    localStorage.setItem("tagshopOrder",JSON.stringify({
        name:custName.value,
        email:custEmail.value,
        whats:custWhats.value,
        watch:selectedWatch.title
    }));
    window.location.href=WISE_LINK+"?amount=299&currency=GBP";
}

// INITIALIZE TOP10
renderTop10();
</script>
</body>
</html>
