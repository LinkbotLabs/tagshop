<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TagShop – Luxury Watch Concierge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
 --gold:#f5d77c;
 --glass:rgba(35,35,35,.65);
 --diamond:linear-gradient(145deg,#fff,#f5d77c,#caa54d);
}

body{margin:0;font-family:Montserrat;background:#050505;color:#fff;overflow-x:hidden}

/* background */
.hero-bg{position:fixed;inset:0;z-index:-2}
.hero-bg img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0;animation:fade 30s infinite}
.hero-bg img:nth-child(1){animation-delay:0s}
.hero-bg img:nth-child(2){animation-delay:6s}
.hero-bg img:nth-child(3){animation-delay:12s}
.hero-bg img:nth-child(4){animation-delay:18s}
.hero-bg img:nth-child(5){animation-delay:24s}
@keyframes fade{0%{opacity:0}5%{opacity:1}20%{opacity:1}25%{opacity:0}100%{opacity:0}}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,.85))}

.section{max-width:1200px;margin:auto;padding:30px 20px}
.glass{background:var(--glass);backdrop-filter:blur(18px);border-radius:22px;padding:25px;border:1px solid rgba(255,215,0,.3)}

h1,h2{font-family:"Playfair Display";color:var(--gold)}

#results{display:flex;gap:25px;overflow-x:auto;padding:20px 0}
#results::-webkit-scrollbar{height:8px}
#results::-webkit-scrollbar-thumb{background:var(--gold)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:25px}

.card{min-width:220px;background:rgba(255,255,255,.07);border-radius:18px;padding:15px;border:1px solid rgba(255,215,0,.25)}
.card img{width:100%;height:200px;object-fit:contain;background:#fff;padding:10px;border-radius:12px}
.card h4{color:var(--gold);font-size:.95rem}

button{width:100%;background:var(--diamond);border:none;padding:12px;border-radius:30px;font-weight:700;cursor:pointer;margin-top:6px}
.buy-dh{background:#111;color:#fff}
.remove{background:#800;color:#fff}

.controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

#cartBar{
 position:fixed;bottom:20px;right:20px;background:var(--glass);
 backdrop-filter:blur(18px);padding:15px 25px;border-radius:40px;
 border:1px solid rgba(255,215,0,.4);display:none;z-index:10
}
</style>
</head>

<body>

<div class="hero-bg">
 <img src="https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3">
 <img src="https://images.unsplash.com/photo-1519741497674-611481863552">
 <img src="https://images.unsplash.com/photo-1601924638867-3ec62b5d35a1">
 <img src="https://images.unsplash.com/photo-1599940824399-b87987ceb72a">
 <img src="https://images.unsplash.com/photo-1612817159949-195b6eb9e31a">
</div>

<div class="section glass">
<h1>TagShop Luxury Watch Concierge</h1>
<p>We search thousands of listings and hand-pick only the best pieces with correct weight, markings and insured UK delivery.</p>
</div>

<div class="section glass">
<input id="q" placeholder="Search Rolex, Omega, Patek, AP, Breitling…">
<button onclick="search()">Search</button>
</div>

<div class="section">
<h2>Luxury Search Results</h2>
<div class="controls">
<button onclick="prevPage()">◀ Previous</button>
<div id="pageInfo">Page 1</div>
<button onclick="nextPage()">Next ▶</button>
</div>
<div id="results"></div>
</div>

<div class="section">
<h2>Your Curated Showcase</h2>
<div id="showcase" class="grid"></div>
</div>

<div class="section glass" id="checkout" style="display:none">
<input placeholder="Full Name">
<input placeholder="Email">
<textarea placeholder="Delivery Address"></textarea>
<button onclick="pay()">Secure Wise Checkout</button>
<p id="thanks" style="display:none;color:var(--gold)">Order confirmed – confirmation email sent.</p>
</div>

<div id="cartBar">
<span id="cartCount">0</span> Selected • <span id="cartTotal">£0</span>
</div>

<script>
const API="AIzaSyB9YwW8EVXQJsVwSMbJrk-NU9B9ZrzzkGs";
const CX="f7e219616fe1d4629";
const AFF="2545671";
const WISE="https://wise.com/pay/me/davids14542";
const PRICE=249;

let last=[],showcase=[];
let startIndex=1;
let currentQuery="";

async function search(){
 currentQuery=document.getElementById("q").value;
 startIndex=1;
 await fetchResults();
}

async function fetchResults(){
 const r=await fetch(`https://www.googleapis.com/customsearch/v1?q=${encodeURIComponent(currentQuery)}&cx=${CX}&key=${API}&start=${startIndex}`);
 const d=await r.json();
 last=d.items.filter(i=>i.link.includes("dhgate")).map(i=>({
  title:i.title,
  img:i.pagemap?.cse_image?.[0]?.src || "https://i.imgur.com/JbGQH6g.png",
  link:i.link.includes("?")?i.link+"&aff="+AFF:i.link+"?aff="+AFF
 }));
 renderResults();
 document.getElementById("pageInfo").innerText="Page "+Math.ceil(startIndex/10);
}

function renderResults(){
 const box=document.getElementById("results");
 box.innerHTML="";
 last.forEach((p,i)=>{
  const d=document.createElement("div");
  d.className="card";
  d.innerHTML=`
    <img src="${p.img}">
    <h4>${p.title}</h4>
    <button class="buy-dh" onclick="window.open('${p.link}','_blank')">Buy Direct</button>
    <button onclick="add(${i})">Add to TagShop</button>
  `;
  box.appendChild(d);
 });
}

function nextPage(){startIndex+=10;fetchResults()}
function prevPage(){if(startIndex>1){startIndex-=10;fetchResults()}}

function add(i){
 const item=last[i];
 if(!item||showcase.find(p=>p.link===item.link))return;
 showcase.push(item);
 renderShowcase();
 updateCart();
 document.getElementById("checkout").style.display="block";
}

function removeItem(i){
 showcase.splice(i,1);
 renderShowcase();
 updateCart();
 if(showcase.length===0){
  document.getElementById("checkout").style.display="none";
  document.getElementById("cartBar").style.display="none";
 }
}

function renderShowcase(){
 const box=document.getElementById("showcase");
 box.innerHTML="";
 showcase.forEach((p,i)=>{
  const d=document.createElement("div");
  d.className="card";
  d.innerHTML=`
    <img src="${p.img}">
    <h4>${p.title}</h4>
    <button class="remove" onclick="removeItem(${i})">Remove</button>
  `;
  box.appendChild(d);
 });
}

function updateCart(){
 document.getElementById("cartBar").style.display="block";
 document.getElementById("cartCount").innerText=showcase.length;
 document.getElementById("cartTotal").innerText="£"+(showcase.length*PRICE);
}

function pay(){
 document.getElementById("thanks").style.display="block";
 window.open(WISE);
}
</script>

</body>
</html>
