<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Opening TagShop…</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  background:#050505;
  color:#f5d77c;
  font-family:Arial, sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  text-align:center;
}
.box {
  background:rgba(255,255,255,0.05);
  border-radius:20px;
  padding:30px;
  max-width:360px;
  box-shadow:0 0 20px rgba(245,215,124,0.2);
}
h1 {
  font-size:1.6em;
  margin-bottom:15px;
}
p {
  font-size:1em;
  opacity:0.9;
}
button {
  margin-top:20px;
  width:100%;
  padding:15px;
  border-radius:12px;
  border:none;
  background:#f5d77c;
  color:#050505;
  font-size:1.1em;
  font-weight:700;
  cursor:pointer;
}
.small {
  margin-top:15px;
  font-size:0.85em;
  opacity:0.8;
}
</style>
</head>

<body>

<div class="box">
  <h1>Open TagShop</h1>
  <p>Facebook blocks our product images.<br>
  To continue safely, please open the shop in your browser.</p>

  <button onclick="openShop()">Open Shop</button>

  <div class="small">This takes 1 second</div>
</div>

<script>
function openShop(){
  var url = "https://linkbotlabs.github.io/tagshop/";

  var ua = navigator.userAgent || navigator.vendor || window.opera;

  // iOS
  if (/iPhone|iPad|iPod/i.test(ua)) {
    window.location.href = "x-safari-" + url;
  }
  // Android
  else if (/Android/i.test(ua)) {
    window.location.href =
      "intent://" + url.replace(/^https?:\/\//, "") +
      "#Intent;scheme=https;package=com.android.chrome;end";
  }
  // Desktop or fallback
  else {
    window.location.href = url;
  }
}
</script>

</body>
</html>
