<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TagShop Search</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: 'Montserrat', sans-serif; padding: 20px; background: #f5f5f5; }
  h1 { text-align: center; }
  #search-bar { width: 100%; max-width: 400px; padding: 10px; font-size: 1em; margin: 10px auto; display: block; }
  #results { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
  .result-card {
    background: #fff;
    padding: 10px;
    border-radius: 6px;
    width: 200px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .result-card img { max-width: 100%; border-radius: 4px; }
  .result-card button {
    margin-top: 8px;
    padding: 5px 10px;
    cursor: pointer;
    border: none;
    border-radius: 4px;
    background: #0077ff;
    color: #fff;
  }
</style>
</head>
<body>

<h1>TagShop Search</h1>
<input type="text" id="search-bar" placeholder="Search watches…">

<div id="results"></div>

<script>
// Simulated search database
const watches = [
  { name: 'Rolex Submariner', img: 'https://via.placeholder.com/150', priceA: '-150', priceAA: '249.99', priceAAA: '499' },
  { name: 'Omega Seamaster', img: 'https://via.placeholder.com/150', priceA: '-120', priceAA: '220.00', priceAAA: '480' },
  { name: 'Patek Philippe Nautilus', img: 'https://via.placeholder.com/150', priceA: '-200', priceAA: '260.00', priceAAA: '499' },
];

// Function to display search results
function displayResults(query) {
  const resultsContainer = document.getElementById('results');
  resultsContainer.innerHTML = '';

  const filtered = watches.filter(w => w.name.toLowerCase().includes(query.toLowerCase()));
  
  filtered.forEach(watch => {
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <img src="${watch.img}" alt="${watch.name}">
      <p>${watch.name}</p>
      <button onclick="addToShowcase('A', '${watch.name}', '${watch.img}', '${watch.priceA}')">Add to A</button>
      <button onclick="addToShowcase('AA', '${watch.name}', '${watch.img}', '${watch.priceAA}')">Add to AA</button>
      <button onclick="addToShowcase('AAA', '${watch.name}', '${watch.img}', '${watch.priceAAA}')">Add to AAA</button>
    `;
    resultsContainer.appendChild(card);
  });

  if (filtered.length === 0 && query.length > 0) {
    resultsContainer.innerHTML = '<p>No watches found.</p>';
  }
}

// Listen to input
document.getElementById('search-bar').addEventListener('input', e => {
  displayResults(e.target.value);
});

// Function to add items to index.html showcase
function addToShowcase(section, name, img, price) {
  // Check if parent window has the showcase
  if (window.opener && !window.opener.closed) {
    window.opener.addItemToShowcase(section, name, img, price);
    alert(`${name} added to section ${section} on Showcase page.`);
  } else {
    alert('Showcase page not open. Please open index.html first.');
  }
}
</script>

</body>
</html>
