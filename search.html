<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TagShop Admin – Search & Curate</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Montserrat;background:#050505;color:#fff;}
h1,h2{font-family:Playfair Display;color:#f5d77c;text-align:center;}
.section{max-width:1200px;margin:auto;padding:20px;}
#results,#showcase{display:flex;gap:20px;overflow-x:auto;}
.card{background:rgba(255,255,255,.08);border-radius:16px;padding:15px;min-width:240px;}
.card img{width:100%;height:200px;object-fit:contain;background:#fff;border-radius:12px;padding:10px;cursor:pointer;}
input,button{width:100%;padding:8px;margin-top:6px;border-radius:8px;border:none;}
button{cursor:pointer;background:#f5d77c;color:#050505;font-weight:600;}
#pager{display:flex;justify-content:center;align-items:center;gap:15px;margin-top:15px;}
#pager span{font-weight:600;}
a{display:block;}
</style>
</head>

<body>

<div class="section">
<h1>TagShop Dealer Search</h1>
<input id="q" placeholder="Rolex Submariner, AP Royal Oak, Patek…">
<button id="searchBtn">Search</button>
</div>

<div class="section">
<h2>Dealer Results</h2>
<div id="results"></div>
<div id="pager"></div>
</div>

<div class="section">
<h2>Your Showcase (max 25)</h2>
<div id="showcase"></div>
<button onclick="goShop()">Go To Shop</button>
</div>

<script>
const API="AIzaSyB9YwW8EVXQJsVwSMbJrk-NU9B9ZrzzkGs";
const CX="f7e219616fe1d4629";
const AFF="2545671";
const WISE="https://wise.com/pay/me/davids14542";

let last=[], showcase=[];
let currentQuery="";
let startIndex=1;
const pageSize=10;

const results=document.getElementById("results");
const showcaseDiv=document.getElementById("showcase");
const pager=document.getElementById("pager");

// Score function (optional)
function score(t){
 t=t.toLowerCase();
 let s=0;
 if(t.includes("aaa"))s+=3;
 if(t.includes("box"))s+=2;
 if(t.includes("papers"))s+=2;
 if(t.includes("904l"))s+=3;
 if(t.includes("sapphire"))s+=2;
 return s;
}

// OPEN SUPPLIER LINK (same logic as shop page)
function searchSupplier(title){
 // Use the same URL construction as Shop page
 const safeTitle = encodeURIComponent(title.replace(/[^a-zA-Z0-9 ]/g," "));
 const url = `https://www.dhgate.com/wholesale/${safeTitle}.html`;
 window.open(url,"_blank");
}

// SEARCH FUNCTION
async function search(newSearch){
 if(newSearch){
   startIndex=1;
   currentQuery=document.getElementById("q").value;
 }
 if(!currentQuery) return;

 const r=await fetch(
  `https://www.googleapis.com/customsearch/v1?q=${encodeURIComponent(currentQuery)}&cx=${CX}&key=${API}&start=${startIndex}`
 );
 const d=await r.json();

 last=(d.items||[]).map(i=>({
   title:i.title,
   img:i.pagemap?.cse_image?.[0]?.src || "https://i.imgur.com/JbGQH6g.png",
   link:i.link.includes("?")?i.link+"&aff="+AFF:i.link+"?aff="+AFF,
   score:score(i.title),
   supplierPrice:0,
   tagshopPrice:0
 })).sort((a,b)=>b.score-a.score);

 renderResults();
 updatePager(d.searchInformation?.totalResults || 0);
}

// RENDER RESULTS
function renderResults(){
 results.innerHTML="";
 last.forEach((p,i)=>{
  const d=document.createElement("div");
  d.className="card";

  d.innerHTML=`
   <a href="${p.link}" target="_blank">
     <img src="${p.img}">
   </a>
   <h4>${p.title}</h4>
   <input placeholder="Supplier Price" type="number" id="s${i}">
   <input placeholder="TagShop Price" type="number" id="t${i}">
   <button id="addBtn${i}">➕ Add to Showcase</button>
  `;

  results.appendChild(d);

  // Add supplier button dynamically (safe)
  const supplierBtn = document.createElement("button");
  supplierBtn.textContent = "🔍 Search Supplier";
  supplierBtn.addEventListener("click",()=>searchSupplier(p.title));
  d.appendChild(supplierBtn);

  // Add to showcase
  document.getElementById(`addBtn${i}`).addEventListener("click",()=>add(i));
 });
}

// PAGINATION
function updatePager(total){
 const page=Math.ceil(startIndex/pageSize);
 const maxPage=Math.ceil(total/pageSize) || 1;

 pager.innerHTML=`
   <button onclick="prevPage()" ${page<=1?"disabled":""}>◀ Previous</button>
   <span>Page ${page} of ${maxPage}</span>
   <button onclick="nextPage()" ${page>=maxPage?"disabled":""}>Next ▶</button>
 `;
}

function nextPage(){
 startIndex+=pageSize;
 search(false);
}

function prevPage(){
 startIndex=Math.max(1,startIndex-pageSize);
 search(false);
}

// SHOWCASE FUNCTIONS
function add(i){
 const p=last[i];
 p.supplierPrice=parseFloat(document.getElementById("s"+i).value)||0;
 p.tagshopPrice=parseFloat(document.getElementById("t"+i).value)||0;
 if(showcase.find(x=>x.link===p.link))return;
 if(showcase.length>=25)return alert("Max 25 items");
 showcase.push(p);
 save();
 renderShowcase();
}

function renderShowcase(){
 showcaseDiv.innerHTML="";
 showcase.forEach((p,i)=>{
  const d=document.createElement("div");
  d.className="card";
  d.innerHTML=`
   <img src="${p.img}">
   <h4>${p.title}</h4>
   <p>£${p.tagshopPrice}</p>
   <button onclick="remove(${i})">Remove</button>
   <button onclick="searchSupplier('${p.title.replace(/'/g,"\\'")}')">🔍 Supplier</button>
  `;
  showcaseDiv.appendChild(d);
 });
}

function remove(i){
 showcase.splice(i,1);
 save(); 
 renderShowcase();
}

function save(){
 localStorage.setItem("tagshopShowcase",JSON.stringify(showcase));
}

function goShop(){ location.href="shop.html"; }

// INITIALIZE
window.onload=function(){
 showcase=JSON.parse(localStorage.getItem("tagshopShowcase")||"[]");
 renderShowcase();
};

// SEARCH BUTTON
document.getElementById("searchBtn").addEventListener("click",()=>search(true));
</script>

</body>
</html>
