<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagshop – Watch Concierge</title>

<style>
body{
  background:#000;
  color:#fff;
  font-family:system-ui;
  margin:0;
  padding:15px;
}
h1{
  text-align:center;
  color:#ffe169;
  margin-bottom:6px;
}
.sub{
  text-align:center;
  color:#aaa;
  font-size:13px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;
}

.card{
  background:#111;
  border-radius:12px;
  padding:10px;
  border:1px solid #222;
}

.card img{
  width:100%;
  border-radius:10px;
}

.title{
  font-weight:700;
  font-size:14px;
  margin-top:8px;
}

.desc{
  font-size:12px;
  color:#ccc;
  margin:6px 0;
}

.price{
  font-size:16px;
  color:#00ffcc;
  font-weight:800;
}

.small{
  font-size:11px;
  color:#aaa;
}

.buy{
  background:#00ffcc;
  color:#000;
  border:none;
  border-radius:8px;
  width:100%;
  padding:10px;
  font-weight:800;
  margin-top:8px;
  cursor:pointer;
}

.admin{
  margin-top:6px;
  font-size:11px;
}

.admin input{
  width:100%;
  margin:3px 0;
  padding:5px;
  border-radius:6px;
  border:none;
}

.admin button{
  width:100%;
  background:#ffe169;
  border:none;
  border-radius:6px;
  padding:6px;
  font-weight:700;
}
</style>
</head>

<body>

<h1>🕰️ Tagshop Watch Concierge</h1>
<div class="sub">
All watches sourced from DHgate verified sellers • UK Delivery • No dropshipping
</div>

<div class="grid" id="wall"></div>

<script>
const MARKUP = 0.30;
const WISE = "https://wise.com/pay/me/davids14542";

function getWall(){
  return JSON.parse(localStorage.getItem("productWall") || "[]");
}

function saveWall(w){
  localStorage.setItem("productWall", JSON.stringify(w));
}

function render(){
  const wall = getWall();
  const div = document.getElementById("wall");
  div.innerHTML = "";

  wall.forEach((p,i)=>{
    const base = (p.cost||0) + (p.ship||0);
    const total = base * (1 + MARKUP);

    const card = document.createElement("div");
    card.className="card";

    card.innerHTML = `
      <img src="${p.thumb}">
      <div class="title">${p.title}</div>
      <div class="desc">${p.desc || "Premium men's luxury watch sourced from verified supplier."}</div>
      <div class="price">£${total.toFixed(2)}</div>
      <div class="small">UK Delivered • includes 30% concierge fee</div>
      <button class="buy" onclick="order(${i})">Request This Watch 🇬🇧</button>

      <div class="admin">
        <input placeholder="DHgate cost £" id="c${i}" value="${p.cost||""}">
        <input placeholder="Shipping £" id="s${i}" value="${p.ship||""}">
        <input placeholder="Description" id="d${i}" value="${p.desc||""}">
        <button onclick="save(${i})">Save</button>
      </div>
    `;

    div.appendChild(card);
  });
}

function save(i){
  const wall = getWall();
  wall[i].cost = parseFloat(document.getElementById("c"+i).value||0);
  wall[i].ship = parseFloat(document.getElementById("s"+i).value||0);
  wall[i].desc = document.getElementById("d"+i).value;
  saveWall(wall);
  render();
}

function order(i){
  const p = getWall()[i];
  const base = (p.cost||0)+(p.ship||0);
  const total = base * 1.30;

  const msg = encodeURIComponent(
    "Tagshop Watch Order\n\n"+
    p.title+"\n\n"+
    (p.desc||"")+"\n\n"+
    "UK Delivered: £"+total.toFixed(2)
  );

  window.open(WISE+"?message="+msg,"_blank");
}

render();
</script>

</body>
</html>
