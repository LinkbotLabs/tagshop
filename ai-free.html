<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tagshop – Free AI Video Generator</title>

<!-- Puter SDK -->
<script src="https://js.puter.com/v2/"></script>

<style>
body{
  font-family:system-ui,Arial;
  background:#0f0f0f;
  color:#fff;
  max-width:800px;
  margin:auto;
  padding:20px;
}
h1{color:#00e5ff}
textarea,input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:none;
  background:#1a1a1a;
  color:#fff;
}
button{
  margin-top:12px;
  padding:12px 18px;
  border:none;
  border-radius:8px;
  background:#00e5ff;
  color:#000;
  font-weight:700;
  cursor:pointer;
}
video{
  width:100%;
  margin-top:20px;
  border-radius:12px;
}
.status{
  margin-top:10px;
  font-size:14px;
  color:#aaa;
}
.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:12px;
  font-size:12px;
  font-weight:700;
  margin-bottom:10px;
}
.ok{background:#1fc27e;color:#000}
.no{background:#ff5f6d;color:#000}
</style>
</head>

<body>

<h1>🎬 Tagshop Free AI Video</h1>
<p>Powered by <strong>Puter.js</strong> · No API keys · Browser only</p>

<div id="loginBadge" class="badge no">Not logged in</div>

<button onclick="login()">Login with Puter</button>

<hr style="margin:30px 0;border:1px solid #222">

<h2>🖼️ Image → Video</h2>

<textarea id="prompt" rows="4">
A clean animated tech advertisement scene,
futuristic UI, neon cyan highlights,
smooth motion, professional style
</textarea>

<input id="imageUrl"
value="https://help-static-aliyun-doc.aliyuncs.com/file-manage-files/zh-CN/20250925/wpimhv/rap.png"/>

<button onclick="generate()">Generate Video</button>

<div id="status" class="status"></div>
<div id="output"></div>

<script>
/* ---------- LOGIN ---------- */
async function login(){
  try{
    await puter.auth.signIn();
    await waitForLogin();
    setLoggedIn(true);
  }catch(e){
    console.error(e);
  }
}

function setLoggedIn(ok){
  const badge = document.getElementById("loginBadge");
  badge.textContent = ok ? "Logged in to Puter" : "Not logged in";
  badge.className = "badge " + (ok ? "ok" : "no");
}

async function waitForLogin(){
  while(!puter.auth.isSignedIn){
    await new Promise(r=>setTimeout(r,300));
  }
}

/* ---------- GENERATE ---------- */
async function generate(){
  const status = document.getElementById("status");
  const output = document.getElementById("output");
  output.innerHTML = "";

  status.textContent = "Checking login…";

  if(!puter.auth.isSignedIn){
    await login();
  }

  status.textContent = "Generating video…";

  try{
    const video = await puter.ai.txt2vid(
      document.getElementById("prompt").value,
      {
        model:"Wan-AI/Wan2.2-I2V-A14B",
        image_url:document.getElementById("imageUrl").value
      }
    );

    video.controls = true;
    video.muted = true;
    video.playsInline = true;

    output.appendChild(video);

    video.addEventListener("loadeddata",()=>{
      video.play().catch(()=>{});
    });

    status.textContent = "Finished ✔";
  }catch(err){
    console.error(err);
    status.textContent =
      "Generation failed. Please stay logged in and try again.";
  }
}
</script>

</body>
</html>
