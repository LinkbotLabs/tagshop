<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TagShop AI Generator</title>
  <script src="https://js.puter.com/v2/"></script>
</head>

<body>

<h1>TagShop AI Generator</h1>
<p>Free AI Image & Video generation powered by Puter</p>

<!-- OFFICIAL PUTER LOGIN -->
<button id="loginBtn">🔐 Login with Puter</button>

<hr>

<h2>Generate Image</h2>
<button id="imgBtn">Generate Image</button>

<h2>Generate Video (Wan 2.2)</h2>
<button id="vidBtn">Generate Video</button>

<div id="status"></div>
<div id="output"></div>

<script>
const status = document.getElementById("status");
const output = document.getElementById("output");

/* OFFICIAL LOGIN */
document.getElementById("loginBtn").onclick = async () => {
  await puter.auth.signIn();
  status.textContent = "✅ Logged in with Puter";
};

/* IMAGE */
document.getElementById("imgBtn").onclick = async () => {
  status.textContent = "Generating image...";
  output.innerHTML = "";

  try {
    const img = await puter.ai.txt2img(
      "A futuristic AI pigeon mascot, neon style"
    );
    output.appendChild(img);
    status.textContent = "Image ready ✔";
  } catch (e) {
    status.textContent = JSON.stringify(e);
  }
};

/* VIDEO */
document.getElementById("vidBtn").onclick = async () => {
  status.textContent = "Generating video...";
  output.innerHTML = "";

  try {
    const video = await puter.ai.txt2vid(
      "A cartoon pigeon explaining AI in a funny way",
      { model: "Wan-AI/Wan2.2-T2V-A14B" }
    );
    output.appendChild(video);
    video.play().catch(()=>{});
    status.textContent = "Video ready ✔";
  } catch (e) {
    status.textContent = JSON.stringify(e);
  }
};
</script>

</body>
</html>
