<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tagshop – Free AI Video Generator</title>
<script src="https://js.puter.com/v2/"></script>

<style>
body{
  font-family:system-ui,Arial;
  background:#0f0f0f;
  color:#fff;
  max-width:800px;
  margin:auto;
  padding:20px;
}
textarea,input,button{
  width:100%;
  margin-top:10px;
  padding:12px;
  border-radius:8px;
  border:none;
}
button{
  background:#00e5ff;
  color:#000;
  font-weight:700;
  cursor:pointer;
}
video{
  width:100%;
  margin-top:20px;
  border-radius:12px;
}
.status{margin-top:10px;color:#aaa}
</style>
</head>

<body>

<h1>🎬 Free AI Video Generator</h1>
<p>Powered by <strong>Puter.js</strong></p>

<textarea id="prompt">
A futuristic animated advertisement showing a free AI text to video generator website
</textarea>

<input id="imageUrl"
value="https://help-static-aliyun-doc.aliyuncs.com/file-manage-files/zh-CN/20250925/wpimhv/rap.png"/>

<button onclick="generate()">Login & Generate Video</button>

<div id="status" class="status"></div>
<div id="output"></div>

<script>
async function generate(){
  const status = document.getElementById("status");
  const output = document.getElementById("output");
  output.innerHTML = "";

  try{
    status.textContent = "Signing in to Puter…";
    await puter.auth.signIn(); // ✅ OFFICIAL PUTER LOGIN

    status.textContent = "Generating video…";

    const video = await puter.ai.txt2vid(
      document.getElementById("prompt").value,
      {
        model:"Wan-AI/Wan2.2-I2V-A14B",
        image_url:document.getElementById("imageUrl").value
      }
    );

    video.controls = true;
    video.muted = true;
    video.playsInline = true;

    output.appendChild(video);

    video.onloadeddata = () => video.play().catch(()=>{});
    status.textContent = "Done ✔";

  }catch(err){
    console.error(err);
    status.textContent =
      "❌ Puter login or generation failed. Please allow popups and try again.";
  }
}
</script>

</body>
</html>
