<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TagShop – Free AI Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h1>TagShop AI Generator</h1>
<p>Free AI Image & Video generation powered by Puter</p>

<textarea
  id="prompt"
  placeholder="Describe what you want to generate..."
  style="width:100%;max-width:600px;height:80px;"
></textarea>

<br><br>

<button id="imageBtn">Generate Image</button>
<button id="videoBtn">Generate Video (Wan 2.2)</button>

<p id="status"></p>

<div id="output"></div>

<!-- OFFICIAL PUTER SCRIPT -->
<script src="https://js.puter.com/v2/"></script>

<script>
  const output = document.getElementById('output');
  const status = document.getElementById('status');
  const promptInput = document.getElementById('prompt');

  function clearOutput() {
    output.innerHTML = '';
  }

  document.getElementById('imageBtn').onclick = async () => {
    clearOutput();
    status.textContent = 'Generating image…';

    try {
      const img = await puter.ai.txt2img(promptInput.value);
      clearOutput();
      output.appendChild(img);
      status.textContent = 'Done';
    } catch (err) {
      status.textContent = 'Error';
      output.textContent = JSON.stringify(err);
    }
  };

  document.getElementById('videoBtn').onclick = async () => {
    clearOutput();
    status.textContent = 'Generating video…';

    try {
      const video = await puter.ai.txt2vid(
        promptInput.value,
        { model: "Wan-AI/Wan2.2-T2V-A14B" }
      );

      clearOutput();
      output.appendChild(video);
      video.play().catch(() => {});
      status.textContent = 'Done';
    } catch (err) {
      status.textContent = 'Error';
      output.textContent = JSON.stringify(err);
    }
  };
</script>

</body>
</html>
